<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d0c">
<link rel="icon" href="assets/rarete-gadz.png">
<title>Collec' 23-151</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Zagot's, la police gothique du Tabagn's de Bordel's (©1994) */
@font-face { font-family: "Zagots"; src: url(assets/zagots.ttf) format("truetype"); font-display: block; }

/* Layout : un tapis de jeu sombre ; en haut la réserve de boosters, puis l'album en grille. Les cartes sont dimensionnées en largeur de carte (cqw). */
:root {
  --bg: #120d0c;
  --bg-2: #241816;
  --surface: #1d1412;
  --line: rgba(212,178,106,.22);
  --wine: #5e1424;
  --wine-deep: #3a0b16;
  --gold: #d4b26a;
  --gold-soft: #f1dfae;
  --parchment: #efe4cc;
  --ink: #2a1a14;
  --muted: #a8968a;
  --fams: #6c609d;
  --fams-soft: #b9adef;
  --f-title: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-gadz: "Zagots", "IM Fell English SC", Georgia, serif;
  --f-body: "EB Garamond", Georgia, "Times New Roman", serif;
  --f-label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse 120% 70% at 50% 0%, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
  color: var(--parchment);
  font-family: var(--f-body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  min-height: 100%;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }

/* ---------- En-tête ---------- */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.head .eyebrow { font-family: var(--f-label); letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
.head h1 { margin: 2px 0 0; font-family: var(--f-gadz); font-weight: 400; font-size: clamp(30px, 7vw, 44px); line-height: 1; color: var(--gold-soft); text-wrap: balance; }
.progress { min-width: 220px; flex: 1 1 220px; max-width: 360px; display: grid; gap: 6px; }
.progress-line { display: flex; justify-content: space-between; font-family: var(--f-label); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
.progress-line span:last-child { color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: rgba(241,223,174,.12); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); border-radius: inherit; transition: width .6s ease; }

/* ---------- Réserve de boosters ---------- */
.reserve {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px 22px;
  background: linear-gradient(180deg, rgba(94,20,36,.55), rgba(58,11,22,.55));
  border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px;
}
.reserve .info { display: grid; gap: 6px; min-width: 0; }
.reserve h2 { margin: 0; font-family: var(--f-label); font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.pips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pip { width: 22px; height: 30px; border-radius: 4px; border: 1.5px solid rgba(212,178,106,.45); background: transparent; }
.pip.on { border-color: var(--gold-soft); background: linear-gradient(135deg, #2b2050, var(--fams) 45%, #3a0b16); box-shadow: 0 0 10px rgba(185,173,239,.35); }
.pips .extra { font-family: var(--f-label); font-weight: 600; font-size: 15px; color: var(--fams-soft); margin-left: 4px; }
.next { margin: 0; font-family: var(--f-label); font-size: 17px; letter-spacing: .03em; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
.rhythm { margin: 0; font-size: 14px; color: var(--muted); }
.gift { margin: 4px 0 0; font-size: 15px; color: var(--fams-soft); font-style: italic; }
.btn-primary {
  border: 0; cursor: pointer; border-radius: 10px; padding: 14px 22px;
  font-family: var(--f-label); font-weight: 700; font-size: 17px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 8px 20px -8px rgba(212,178,106,.6);
}
.btn-primary:disabled { cursor: not-allowed; opacity: .4; box-shadow: none; }
.btn-ghost { border: 1px solid var(--line); background: rgba(241,223,174,.05); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-family: var(--f-label); font-size: 15px; letter-spacing: .06em; color: var(--gold-soft); }
.btn-ghost:hover { border-color: var(--gold); }
@media (max-width: 620px) {
  .reserve { grid-template-columns: auto 1fr; }
  .reserve .btn-primary { grid-column: 1 / -1; width: 100%; }
}

/* ---------- Filtres ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: var(--f-label); font-size: 15px; letter-spacing: .06em; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.chip .n { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* ---------- Album ---------- */
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
@media (max-width: 420px) { .album { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; } }
.tile { position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; transition: transform .2s ease; }
.tile:hover:not(.missing) { transform: translateY(-3px); }
.tile.missing { cursor: default; }
.tile.missing .cardback { filter: grayscale(1) brightness(.4); }
.tile .slot-num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; font-family: var(--f-label); color: rgba(241,223,174,.75); pointer-events: none; }
.tile .slot-num b { font-size: 26px; font-weight: 600; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.tile .slot-num span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.badges { position: absolute; top: -6px; right: -6px; display: flex; gap: 4px; z-index: 3; }
.badge { font-family: var(--f-label); font-weight: 700; font-size: 13px; line-height: 1; padding: 5px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.badge.var { background: var(--fams); color: #fff; }

.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 22px; margin: 6px 0 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 8px; font-family: var(--f-label); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.legend .rarity { width: 40px; }

/* ---------- Carte ---------- */
.card { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 63 / 88; border-radius: 4.6% / 3.3%; overflow: hidden; box-shadow: 0 10px 24px -10px rgba(0,0,0,.8), 0 0 0 1px rgba(212,178,106,.25); }
.card { --c-edge: #b8b0a2; --c-bar1: #f4efe6; --c-bar2: #cfc6b6; --c-num: #e6dfd2; }
.v-doree { --c-edge: #fff1c2; --c-bar1: #fffaf0; --c-bar2: #e9c768; --c-num: #fff1c2; }
.card-in { position: absolute; inset: 0; padding: 3.6cqw; background: linear-gradient(160deg, #2a2320, #0e0b0a); }
.frame {
  position: relative; height: 100%;
  border-radius: 2.6cqw; border: .6cqw solid var(--c-edge);
  background: linear-gradient(var(--wine), var(--wine-deep));
  display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 2.2cqw; padding: 2.8cqw;
  overflow: hidden;
}
.bar {
  position: relative; z-index: 1; min-width: 0;
  display: flex; justify-content: space-between; align-items: center; gap: 2cqw;
  background: linear-gradient(180deg, var(--c-bar1), var(--c-bar2)); color: var(--ink);
  border-radius: 2cqw / 50%; padding: 1.3cqw 3.2cqw;
  box-shadow: inset 0 -.5cqw 0 rgba(0,0,0,.18);
}
.name { font-family: var(--f-gadz); font-weight: 400; font-size: 7.4cqw; line-height: 1.2; padding-top: .3cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name.long { font-size: 5.8cqw; }
.bar.top { justify-content: center; }
.bar.top .name { text-align: center; }
.type { font-family: var(--f-label); font-weight: 600; font-size: 4.2cqw; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rarity { flex: none; display: inline-block; width: 11cqw; aspect-ratio: 240 / 122; background: center / contain no-repeat; filter: drop-shadow(0 0 .25px #2a1a14) drop-shadow(0 0 .6px #2a1a14); }
.rl-commune { background-image: url(assets/rarete-commune.png); }
.rl-peu-commune { background-image: url(assets/rarete-peu-commune.png); }
.rl-rare { background-image: url(assets/rarete-rare.png); }
.rl-mythique { background-image: url(assets/rarete-mythique.png); }
.rl-gadz { background-image: url(assets/rarete-gadz.png); }
.art { position: relative; aspect-ratio: 4 / 3; border: .6cqw solid var(--c-edge); border-radius: .6cqw; overflow: hidden; background: #0b1426; }
.art svg, .art img { display: block; width: 100%; height: 100%; }
.art img { object-fit: cover; object-position: 50% 25%; }
.notext .frame { grid-template-rows: auto 1fr auto auto; }
.notext .art { aspect-ratio: auto; min-height: 0; }
.textbox { min-height: 0; overflow: hidden; background: var(--parchment); color: var(--ink); border-radius: 1cqw; padding: 2.6cqw 3.6cqw; display: grid; align-content: center; font-family: var(--f-body); font-size: 4.7cqw; line-height: 1.3; text-align: center; }
.textbox p { margin: 0; font-style: italic; text-wrap: balance; }
.textbox.gadz { gap: 1cqw; }
.textbox .pn { font-family: var(--f-gadz); font-size: 17cqw; line-height: .95; color: var(--wine); }
.textbox .pn-sub { font-size: 4.2cqw; }
.numbering { position: relative; z-index: 1; display: flex; justify-content: space-between; font-family: var(--f-label); font-weight: 500; font-size: 3.2cqw; letter-spacing: .1em; text-transform: uppercase; color: var(--c-num); padding-inline: 1cqw; font-variant-numeric: tabular-nums; }

/* Variante textless : l'image occupe toute la carte */
.v-textless .frame { display: flex; flex-direction: column; gap: 2cqw; }
.v-textless .art { position: absolute; inset: 0; aspect-ratio: auto; border: 0; border-radius: 0; z-index: 0; }
.v-textless .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(10,6,6,.35), transparent 22%, transparent 60%, rgba(10,6,6,.85)); }
.v-textless .textbox { display: none; }
.v-textless .bar.top { margin-bottom: auto; }

/* Variante dorée */
.v-doree .card-in { background: linear-gradient(160deg, #fff1c2, #b98a2c 45%, #fbe7a6 70%, #8a6418); }
.v-doree .frame { background: linear-gradient(160deg, #4a340f, #1d1405); border-color: #fff1c2; }
.v-doree .bar { background: linear-gradient(180deg, #fffaf0, #e9c768); }
.v-doree .art { border-color: #fff1c2; }
.v-doree .frame { box-shadow: 0 0 0 .4cqw rgba(255,226,140,.55), inset 0 0 4cqw rgba(255,214,110,.35); }

/* Reflet brillant */
.foil {
  position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0; mix-blend-mode: screen;
  background: linear-gradient(115deg, transparent 30%, rgba(255,236,170,.6) 42%, rgba(170,215,255,.5) 50%, rgba(255,160,210,.45) 58%, transparent 70%);
  background-size: 260% 260%; background-position: var(--px, 50%) 50%;
}
.r-mythique .foil { opacity: .28; }
.v-brillante .foil, .v-doree .foil { opacity: .5; animation: sheen 4.5s ease-in-out infinite alternate; }
.v-brillante .card-in { background: linear-gradient(160deg, #3b2f5c, #0e0b0a 55%, #2a3c55); }
@keyframes sheen { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }

/* ---------- Dos de carte ---------- */
.cardback { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 63 / 88; border-radius: 4.6% / 3.3%; overflow: hidden; box-shadow: 0 10px 24px -10px rgba(0,0,0,.8); }
.cardback-in { position: absolute; inset: 0; padding: 3.6cqw; background: linear-gradient(160deg, #2a2320, #0e0b0a); }
.cardback-face { position: relative; height: 100%; border: .6cqw solid #b8b0a2; border-radius: 2.6cqw; background: radial-gradient(circle at 50% 45%, #7a1f33, var(--wine-deep) 72%); display: grid; place-items: center; }
.cardback-face::before { content: ""; position: absolute; inset: 3cqw; border: .3cqw solid rgba(230,223,210,.35); border-radius: 1.6cqw; }
.cardback-logo { width: 64cqw; aspect-ratio: 240 / 122; background: url(assets/logo-fams.png) center / contain no-repeat; filter: drop-shadow(0 0 2cqw rgba(0,0,0,.6)); }
.cardback-am { position: absolute; inset: 9cqw 12cqw; background: url(assets/am.png) center / contain no-repeat; opacity: .55; filter: brightness(0); }
.cardback-logo { position: relative; z-index: 1; width: 52cqw !important; filter: drop-shadow(0 0 2.5cqw rgba(40,8,16,.95)) drop-shadow(0 0 1cqw rgba(0,0,0,.7)) !important; }

/* ---------- Booster (paquet) ---------- */
.pack { container-type: inline-size; position: relative; width: min(60vw, 250px); aspect-ratio: 63 / 100; cursor: pointer; border: 0; padding: 0; background: none; }
.pack.mini { width: 66px; cursor: default; pointer-events: none; }
.pack-body, .pack-top {
  position: absolute; left: 0; right: 0;
  background: linear-gradient(135deg, #241a45, var(--fams) 28%, #3a0b16 55%, var(--fams) 80%, #241a45);
  box-shadow: 0 20px 40px -14px rgba(0,0,0,.9);
}
.pack-body { top: 14%; bottom: 0; border-radius: 0 0 5cqw 5cqw; display: grid; place-items: center; align-content: center; gap: 4cqw; overflow: hidden; transition: transform .6s cubic-bezier(.5,0,.7,.4) .35s, opacity .4s ease .55s; }
.pack-top { top: 0; height: 14.5%; border-radius: 5cqw 5cqw 0 0; border-bottom: .8cqw dashed rgba(255,255,255,.55); transform-origin: 0% 100%; transition: transform .55s cubic-bezier(.2,.8,.3,1), opacity .5s ease .1s; }
.pack-body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 48%, transparent 60%); background-size: 250% 100%; animation: sheen 3s ease-in-out infinite alternate; mix-blend-mode: soft-light; }
.pack-logo { width: 70cqw; aspect-ratio: 240 / 122; background: url(assets/logo-fams.png) center / contain no-repeat; filter: drop-shadow(0 1cqw 2cqw rgba(0,0,0,.6)); }
.pack-title { font-family: var(--f-gadz); font-size: 13cqw; color: var(--gold-soft); line-height: 1; text-shadow: 0 .6cqw 1.5cqw rgba(0,0,0,.6); }
.pack-sub { font-family: var(--f-label); font-weight: 600; font-size: 6cqw; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-soft); opacity: .85; text-align: center; }
.pack.mini .pack-title, .pack.mini .pack-sub { display: none; }
.pack { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.pack-cut { position: absolute; z-index: 2; top: calc(14.5% - .5cqw); height: 1cqw; left: var(--cl, 0); right: var(--cr, auto); width: var(--cut, 0%); border-radius: 1cqw; background: #fffaf0; box-shadow: 0 0 4cqw 1.5cqw var(--glow, rgba(255,236,190,.85)); transition: width .25s ease; pointer-events: none; }
.pack.cutting .pack-cut { transition: none; }
.pack.torn .pack-cut { opacity: 0; transition: opacity .3s ease .15s; }
.pack.torn .pack-top { transform: translate(35%, -140%) rotate(-28deg); opacity: 0; }
.rflash { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; background: radial-gradient(circle at 50% 44%, var(--fc) 0%, transparent var(--fr, 55%)); animation: rflash 1.2s ease-out forwards; }
.rflash::before { content: ""; position: absolute; inset: -60%; background: repeating-conic-gradient(from 0deg at 50% 50%, var(--fc) 0deg 5deg, transparent 5deg 20deg); -webkit-mask: radial-gradient(circle at 50% 50%, #000 0, transparent 38%); mask: radial-gradient(circle at 50% 50%, #000 0, transparent 38%); opacity: var(--fo, .4); animation: rays 1.2s ease-out forwards; }
@keyframes rflash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
@keyframes rays { from { transform: rotate(0deg) scale(.7); } to { transform: rotate(30deg) scale(1.15); } }
.godflash { position: fixed; inset: 0; pointer-events: none; z-index: 60; background: radial-gradient(circle at 50% 45%, rgba(255,246,214,.95), rgba(232,195,90,.55) 30%, rgba(108,96,157,.35) 55%, transparent 75%); animation: godflash 1.6s ease-out forwards; }
@keyframes godflash { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
.pack.torn.to-left .pack-top { transform-origin: 100% 100%; transform: translate(-35%, -140%) rotate(28deg); }
.pack.torn .pack-body { transform: translateY(70%) scale(.92); opacity: 0; }

/* ---------- Écrans superposés ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: radial-gradient(ellipse 90% 60% at 50% 45%, #2a1418, #0b0707 75%);
  display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-y: auto;
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ov-top { width: 100%; max-width: 760px; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; }
.ov-count { font-family: var(--f-label); font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-variant-numeric: tabular-nums; }
.ov-stage { flex: 1; width: 100%; display: grid; place-items: center; perspective: 1200px; min-height: 0; outline: none; touch-action: pan-y; }
.ov-hint { margin: 0; min-height: 26px; text-align: center; font-family: var(--f-label); font-size: 17px; letter-spacing: .08em; color: var(--muted); }
.ov-hint.big { font-size: 24px; color: var(--gold-soft); letter-spacing: .12em; text-transform: uppercase; }
.ov-hint.mythic { color: var(--fams-soft); }

.deal { position: relative; width: min(78vw, 340px, calc((100dvh - 190px) * 63 / 88)); animation: dealIn .45s cubic-bezier(.2,.8,.3,1); }
.deal.out { animation: dealOut .35s ease-in forwards; }
.deal { transition: translate .25s ease, rotate .25s ease; touch-action: none; }
@keyframes dealIn { from { transform: translateY(50px) scale(.92); opacity: 0; } }
@keyframes dealOut { to { transform: translateX(-60%) rotate(-8deg); opacity: 0; } }
.flip { position: relative; width: 100%; aspect-ratio: 63 / 88; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.2,.7,.2,1); cursor: pointer; }
.flip.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.front { transform: rotateY(180deg); }
.g-rare .flip:not(.flipped) .face.back { filter: drop-shadow(0 0 16px rgba(232,195,90,.85)); }
.g-mythique .flip:not(.flipped) .face.back { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(185,173,239,.7)); } 50% { filter: drop-shadow(0 0 34px rgba(185,173,239,1)); } }
.burst { position: absolute; inset: -40%; border-radius: 50%; pointer-events: none; opacity: 0; z-index: -1; }
.burst.go { animation: burst 1.2s ease-out forwards; }
.g-rare .burst { background: radial-gradient(circle, rgba(241,223,174,.75), transparent 60%); }
.g-mythique .burst { background: radial-gradient(circle, rgba(185,173,239,.9), rgba(108,96,157,.35) 40%, transparent 65%); }
@keyframes burst { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.2); } }

.summary { width: 100%; max-width: 760px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; align-content: center; }
@media (min-width: 640px) { .summary { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.sum-item { position: relative; animation: dealIn .4s cubic-bezier(.2,.8,.3,1) backwards; }
.sum-item .tag { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); white-space: nowrap; z-index: 3; }
.ov-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.viewer .stage-v { flex: 1; display: grid; place-items: center; perspective: 1100px; width: 100%; min-height: 0; }
.viewer .big { width: min(80vw, 380px, calc((100dvh - 230px) * 63 / 88)); transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .5s cubic-bezier(.2,.7,.2,1); touch-action: none; }
.viewer .big.live { transition: transform .08s linear; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
/* ================= Données : tout vient de la base Supabase ================= */
const CFG = window.COLLEC_CFG;
const SB = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false } });
const TOKEN_KEY = "collec23151-token";
let TOKEN = null;
try { TOKEN = localStorage.getItem(TOKEN_KEY); } catch (e) {}
const saveToken = t => { TOKEN = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

let EDITION = "2026";
let CARDS = [];
const TYPES = ["Gadz", "Trad's", "Chant", "Manip'", "Tabagn's"];
const RORDER = ["commune", "peu-commune", "rare", "mythique"];
// Les Gadz ont leur propre niveau, hors classement : tous à égalité
const RLABEL = { "gadz": "Gadz", "commune": "Commune", "peu-commune": "Peu commune", "rare": "Rare", "mythique": "Mythique" };
const RANK = { "commune": 0, "peu-commune": 1, "gadz": 1, "rare": 2, "mythique": 3 };
const VORDER = ["normale", "brillante", "textless", "doree"];
const VLABEL = { normale: "Normale", brillante: "Brillante", textless: "Textless", doree: "Dorée" };
const score = p => RANK[p.card.rarity] * 10 + (p.card.rarity === "gadz" ? 5 : 0) + VORDER.indexOf(p.variant) * 12;

const media = path => !path ? null : /^https?:/.test(path) ? path : `${CFG.url}/storage/v1/object/public/${CFG.bucket}/${path}`;
async function loadCards() {
  const [{ data: cards, error }, { data: st }] = await Promise.all([
    SB.from("cards").select("*").order("id"),
    SB.from("settings").select("data").eq("id", 1).maybeSingle()
  ]);
  if (error) throw error;
  if (st && st.data && st.data.edition) EDITION = st.data.edition;
  CARDS = cards.map(c => ({
    id: c.id, name: c.name, type: c.type, sub: c.sub || "", fams: c.fams || "", rarity: c.rarity,
    art: c.art || "trad", hue: c.hue ?? 30, text: c.text || "",
    photo: (c.photo_normale || c.photo_textless) ? { normale: media(c.photo_normale || c.photo_textless), textless: media(c.photo_textless || c.photo_normale) } : null,
    audio: (c.audio_normale || c.audio_textless || c.audio_doree) ? { normale: media(c.audio_normale || c.audio_textless), textless: media(c.audio_textless), doree: media(c.audio_doree) } : null
  }));
}

// État du joueur, tel que renvoyé par le serveur
let state = { pseudo: "", stock: 0, gifts: 0, gift: "", cap: 5, nextAt: null, periodMin: 360, owned: {}, canGift: false };
function applyState(s) {
  state.pseudo = s.pseudo; state.stock = s.stock; state.gifts = s.gifts; state.gift = s.gift_reason || "";
  state.canGift = !!s.can_gift;
  state.cap = s.cap; state.nextAt = s.next_at ? Date.parse(s.next_at) : null; state.periodMin = s.period_min;
  state.owned = {};
  (s.owned || []).forEach(([cid, v, n]) => { state.owned[cid + ":" + v] = n; });
}
const total = () => state.stock + state.gifts;
const ownedCount = id => VORDER.reduce((s, v) => s + (state.owned[id + ":" + v] || 0), 0);
const ownedVariants = id => VORDER.filter(v => state.owned[id + ":" + v]);

const ERRORS = {
  pseudo_pris: "Ce pseudo est déjà pris. Si c'est le tien, passe par « J'ai déjà un compte ».",
  pseudo_invalide: "Ton pseudo doit faire entre 2 et 24 caractères.",
  code_invalide: "Le code doit faire exactement 4 chiffres.",
  inconnu: "Aucune collec' à ce pseudo. Vérifie l'orthographe, ou crée ta collec'.",
  mauvais_code: "Code incorrect. Au bout de 5 essais, le compte est bloqué 5 minutes.",
  bloque: "Trop d'essais : réessaie dans 5 minutes.",
  pas_de_booster: "Tu n'as plus de booster pour l'instant.",
  pas_autorise: "Tu n'as pas (ou plus) le droit d'offrir des boosters.",
  session_invalide: "Ta session a expiré : reconnecte-toi."
};
const errText = e => { const m = String(e && e.message || e); const k = Object.keys(ERRORS).find(k => m.includes(k)); return k ? ERRORS[k] : "Problème de connexion. Vérifie ton réseau et réessaie."; };
async function rpc(name, args) {
  const { data, error } = await SB.rpc(name, args);
  if (error) {
    if (String(error.message).includes("session_invalide")) { saveToken(null); showLogin("Ta session a expiré : reconnecte-toi."); }
    throw error;
  }
  return data;
}
let refreshing = false;
async function refreshState() {
  if (!TOKEN || refreshing) return;
  refreshing = true;
  try { applyState(await rpc("me", { p_token: TOKEN })); renderAll(); } catch (e) {} finally { refreshing = false; }
}

/* ================= Illustrations provisoires ================= */
let uidc = 0;
const ART = {
  gadz: (u, h) => `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="g${u}" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="hsl(${h} 45% 40%)"/><stop offset="1" stop-color="hsl(${h} 55% 11%)"/></radialGradient></defs><rect width="400" height="300" fill="url(#g${u})"/><circle cx="200" cy="120" r="50" fill="#1a1012"/><path d="M78 300 C86 206 140 182 200 182 C260 182 314 206 322 300 Z" fill="#1a1012"/><path d="M172 186 L200 232 L228 186" fill="none" stroke="hsl(${h} 40% 70%)" stroke-width="5" opacity=".45"/><text x="200" y="138" text-anchor="middle" font-size="52" font-family="Georgia,serif" fill="hsl(${h} 45% 65%)" opacity=".55">?</text></svg>`,

/* Extraits musicaux des cartes. Plus tard : un vrai fichier audio par carte (colonne « audio »).

const TUNES = {};

// Une version sans fichier reprend celui de la version normale.

$("snd-btn").onclick = () => {
  muted = !muted;
  try { localStorage.setItem("collec23151-mute", muted ? "1" : "0"); } catch (e) {}
  if (muted) stopCardAudio(); else ac();
  renderSnd();
};

/* Couleur de l'éclat selon la meilleure rareté du booster */
const GLOW = {
  "commune":     { c: "rgba(255,244,220,.35)", r: "40%", o: .15 },
  "gadz":        { c: "rgba(235,238,245,.5)",  r: "46%", o: .2 },
  "peu-commune": { c: "rgba(190,214,255,.55)", r: "48%", o: .25 },
  "rare":        { c: "rgba(245,205,92,.8)",   r: "58%", o: .45 },
  "mythique":    { c: "rgba(185,173,239,.95)", r: "68%", o: .6 }
};
const bestRarity = pulls => pulls.reduce((b, p) => RANK[p.card.rarity] > RANK[b] ? p.card.rarity : b, "commune");

/* ================= Ouverture d'un booster ================= */
let session = null;
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

let opening = false;
async function startOpening() {
  if (total() < 1 || opening || session) return;
  opening = true; renderReserve();
  let res;
  try { res = await rpc("open_booster", { p_token: TOKEN }); }
  catch (e) { opening = false; toast(errText(e)); refreshState(); return; }
  opening = false;
  const pulls = res.pulls.map(p => ({ card: CARDS.find(c => c.id === p.card_id), variant: p.variant, newCard: p.new_card, newVariant: p.new_variant })).filter(p => p.card);
  pulls.sort((a, b) => score(a) - score(b));
  applyState(res.state);
  session = { pulls, i: -1, phase: "pack", god: !!res.god };
  document.body.style.overflow = "hidden";
  $("opening").hidden = false;
  $("ov-skip").hidden = false;
  showPack();
  $("ov-stage").focus();
}
function showPack() {
  const st = $("ov-stage"); st.innerHTML = "";
  const pk = document.createElement("div");
  pk.className = "pack";
  pk.innerHTML = `<div class="pack-top"></div><div class="pack-body"><div class="pack-logo"></div><div class="pack-title">Booster</div><div class="pack-sub">5 cartes</div></div><div class="pack-cut"></div>`;
  // La lumière qui filtre par la découpe prend déjà la couleur de la meilleure carte
  pk.style.setProperty("--glow", GLOW[bestRarity(session.pulls)].c.replace(/[\d.]+\)$/, "1)"));
  st.appendChild(pk);
  $("ov-count").textContent = "Booster · 23-151";
  setHint("Touche le booster, ou fais glisser ton doigt de côté pour le découper");

}

/* Découpe au doigt : on peut glisser n'importe où sur l'écran, dans les deux sens.
   Il suffit de parcourir environ un tiers de la largeur du booster. */
let cut = null, swiped = false;
const cutNeeded = pk => Math.max(60, pk.offsetWidth * .35);
$("ov-stage").addEventListener("pointerdown", e => {
  if (!session || session.phase !== "pack") return;
  const pk = $("ov-stage").querySelector(".pack");
  cut = { x: e.clientX, y: e.clientY, pk, dir: 1, moved: false };
  try { $("ov-stage").setPointerCapture(e.pointerId); } catch (err) {}
  pk.classList.add("cutting");
});
$("ov-stage").addEventListener("pointermove", e => {
  if (!cut) return;
  const dx = e.clientX - cut.x;
  if (Math.abs(dx) > 8) cut.moved = true;
  cut.dir = dx < 0 ? -1 : 1;
  cut.pk.style.setProperty("--cl", cut.dir < 0 ? "auto" : "0");
  cut.pk.style.setProperty("--cr", cut.dir < 0 ? "0" : "auto");
  cut.pk.style.setProperty("--cut", Math.min(100, Math.abs(dx) / cutNeeded(cut.pk) * 100) + "%");
});
/* Glisser pendant l'ouverture : retourne la carte, puis passe à la suivante */
let sw = null;
$("ov-stage").addEventListener("pointerdown", e => {
  if (!session || session.phase !== "cards") return;
  const el = $("ov-stage").querySelector(".deal"); if (!el) return;
  sw = { x: e.clientX, y: e.clientY, el, moved: false };
  try { $("ov-stage").setPointerCapture(e.pointerId); } catch (err) {}
});
$("ov-stage").addEventListener("pointermove", e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) sw.moved = true;
  if (sw.moved) { sw.el.style.translate = `${dx * .6}px 0`; sw.el.style.rotate = `${dx * .02}deg`; }
});
function endSwipe(e, cancelled) {
  if (!sw) return;
  const s = sw; sw = null;
  s.el.style.translate = ""; s.el.style.rotate = "";
  if (!s.moved) return;
  swiped = true;
  if (!cancelled && Math.abs(e.clientX - s.x) > 50) { swiped = false; advance(); setTimeout(() => { swiped = false; }, 0); swiped = true; }
}
$("ov-stage").addEventListener("pointerup", e => endSwipe(e, false));
$("ov-stage").addEventListener("pointercancel", e => endSwipe(e, true));

function endCut(e, cancelled) {
  if (!cut) return;
  const c = cut; cut = null;
  c.pk.classList.remove("cutting");
  if (!c.moved) return;
  swiped = true; // le « clic » qui suit un glissement est ignoré
  if (!cancelled && Math.abs(e.clientX - c.x) >= cutNeeded(c.pk)) tearPack(c.dir);
  else c.pk.style.setProperty("--cut", "0%");
}
$("ov-stage").addEventListener("pointerup", e => endCut(e, false));
$("ov-stage").addEventListener("pointercancel", e => endCut(e, true));

function tearPack(dir = 1) {
  if (!session || session.phase !== "pack") return;
  session.phase = "tearing";
  const st = $("ov-stage"), pk = st.querySelector(".pack");
  pk.style.setProperty("--cut", "100%");
  pk.classList.add("torn", dir < 0 ? "to-left" : "to-right");
  buzz(session.god ? [80, 50, 80, 50, 200] : 30);
  sfx.tear();
  if (!session.god) {
    const best = bestRarity(session.pulls), g = GLOW[best], fl = document.createElement("div");
    fl.className = "rflash";
    fl.style.setProperty("--fc", g.c); fl.style.setProperty("--fr", g.r); fl.style.setProperty("--fo", g.o);
    $("opening").appendChild(fl); setTimeout(() => fl.remove(), 1400);
    setTimeout(() => sfx.glow(RANK[best]), 180);
  }
  if (session.god) {
    setTimeout(() => sfx.god(), 200);
    const fl = document.createElement("div"); fl.className = "godflash"; $("opening").appendChild(fl); setTimeout(() => fl.remove(), 1800);
    $("ov-count").textContent = "God pack";
    setHint("God pack ! 2 Gadz et 3 rares ou mythiques, toutes en variante", "big mythic");
  }
  setTimeout(() => { if (session) { session.phase = "cards"; dealNext(); } }, session.god ? 1700 : 900);
}
function setHint(t, cls = "") { const h = $("ov-hint"); h.className = "ov-hint " + cls; h.textContent = t; }
function advance() {
  if (!session) return;
  if (swiped) { swiped = false; return; }
  if (session.phase === "pack") return tearPack(1);
  if (session.phase !== "cards") return;
  const cur = $("ov-stage").querySelector(".deal");
  const flip = cur && cur.querySelector(".flip");
  if (flip && !flip.classList.contains("flipped")) return reveal(cur);
  if (session.i >= session.pulls.length - 1) return showSummary();
  session.phase = "moving";
  cur.classList.add("out");
  setTimeout(() => { session.phase = "cards"; dealNext(); }, 300);
}
function dealNext() {
  stopCardAudio();
  session.i++;
  const p = session.pulls[session.i], st = $("ov-stage");
  st.innerHTML = "";
  const d = document.createElement("div");
  const r = RANK[p.card.rarity];
  d.className = "deal" + (r === 3 ? " g-mythique" : r === 2 ? " g-rare" : "");
  const f = document.createElement("div"); f.className = "flip";
  const back = document.createElement("div"); back.className = "face back"; back.appendChild(backEl());
  const front = document.createElement("div"); front.className = "face front"; front.appendChild(cardEl(p.card, p.variant));
  f.append(back, front);
  const burst = document.createElement("div"); burst.className = "burst";
  d.append(burst, f);
  st.appendChild(d);
  $("ov-count").textContent = `Carte ${session.i + 1} / ${session.pulls.length}`;
  setHint(r >= 2 ? "Ça brille… touche ou glisse pour retourner" : "Touche ou glisse pour retourner la carte");
}
function reveal(d) {
  const p = session.pulls[session.i], r = RANK[p.card.rarity];
  d.querySelector(".flip").classList.add("flipped");
  sfx.flip();
  if (r >= 2) { d.querySelector(".burst").classList.add("go"); buzz(r === 3 ? [60, 60, 120] : 60); }
  const epic = p.variant === "doree";
  if (epic) { d.querySelector(".burst").classList.add("go"); buzz([100, 60, 100, 60, 300]); }
  setTimeout(() => {
    if (epic) return sfx.epic();
    if (r === 3) sfx.mythique(); else if (r === 2) sfx.rare();
    if (p.variant !== "normale") sfx.sparkle();
  }, 300);
  // L'extrait de la carte attend la fin de la fanfare
  playCardAudio(p.card, epic ? 3000 : r >= 2 ? 1300 : 700, p.variant);
  const parts = [];
  if (p.variant !== "normale") parts.push(VLABEL[p.variant] + " !");
  if (r === 3) parts.push("Mythique !"); else if (r === 2) parts.push("Rare !");
  if (p.newCard) parts.push("Nouvelle carte");
  const last = session.i >= session.pulls.length - 1;
  setTimeout(() => setHint(parts.length ? parts.join(" · ") : (last ? "Touche ou glisse pour voir le résumé" : "Touche ou glisse pour la suivante"),
    (r === 3 || p.variant !== "normale") ? "big mythic" : r === 2 || p.newCard ? "big" : ""), 380);
}
function showSummary() {
  if (!session) return;
  session.phase = "summary";
  $("ov-skip").hidden = true;
  $("ov-count").textContent = "Ton booster";
  const st = $("ov-stage"); st.innerHTML = "";
  const g = document.createElement("div"); g.className = "summary";
  session.pulls.forEach((p, i) => {
    const it = document.createElement("div"); it.className = "sum-item"; it.style.animationDelay = (i * 70) + "ms";
    it.appendChild(cardEl(p.card, p.variant));
    const label = p.newCard ? "Nouvelle" : p.newVariant ? VLABEL[p.variant] : "";
    if (label) { const t = document.createElement("span"); t.className = "badge tag" + (p.newVariant && !p.newCard ? " var" : ""); t.textContent = label; it.appendChild(t); }
    g.appendChild(it);
  });
  const act = document.createElement("div"); act.className = "ov-actions";
  const close = document.createElement("button"); close.type = "button"; close.className = "btn-primary"; close.textContent = "Ranger dans l'album";
  close.onclick = e => { e.stopPropagation(); closeOpening(); };
  act.appendChild(close);
  if (total() > 0) {
    const again = document.createElement("button"); again.type = "button"; again.className = "btn-ghost";
    again.textContent = `Ouvrir le suivant (${total()})`;
    again.onclick = e => { e.stopPropagation(); closeOpening(); startOpening(); };
    act.appendChild(again);
  }
  const box = document.createElement("div"); box.style.cssText = "display:grid;gap:26px;justify-items:center;width:100%";
  box.append(g, act);
  st.appendChild(box);
  const nNew = session.pulls.filter(p => p.newCard).length;
  setHint(nNew ? `${nNew} nouvelle${nNew > 1 ? "s" : ""} carte${nNew > 1 ? "s" : ""} dans ta collec'` : "Que des doublons cette fois, ils comptent quand même", nNew ? "big" : "");
}
function closeOpening() {
  stopCardAudio();
  session = null;
  $("opening").hidden = true;
  document.body.style.overflow = "";
  renderAll();
  $("open-btn").focus();
}
$("ov-stage").addEventListener("click", advance);
$("ov-stage").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); } });
$("ov-skip").addEventListener("click", showSummary);
$("open-btn").addEventListener("click", () => { renderAll(); startOpening(); });

/* ================= Visionneuse ================= */
let viewing = null;
function openViewer(card, variant) {
  const vs = ownedVariants(card.id);
  viewing = { card, variant: variant || vs[vs.length - 1] };
  renderViewer();
  document.body.style.overflow = "hidden";
  $("viewer").hidden = false;
  $("v-close").focus();
}
function renderViewer() {
  const { card, variant } = viewing, holder = $("v-card");
  holder.innerHTML = ""; holder.appendChild(cardEl(card, variant));
  $("v-num").textContent = `${pad(card.id)} / ${pad(CARDS.length)} · ${RLABEL[card.rarity]}`;
  const tabs = $("v-tabs"); tabs.innerHTML = "";
  VORDER.forEach(v => {
    const n = state.owned[card.id + ":" + v] || 0;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", String(v === variant));
    b.disabled = !n; if (!n) b.style.opacity = ".35";
    b.innerHTML = `${VLABEL[v]}<span class="n">${n ? "×" + n : "–"}</span>`;
    b.onclick = () => { viewing.variant = v; renderViewer(); };
    tabs.appendChild(b);
  });
  const total = ownedCount(card.id);
  $("v-owned").textContent = `Possédée ${total} fois · incline la carte pour voir le reflet`;
  $("v-audio").hidden = !hasAudio(card);
  const remix = audioFor(card, variant) !== audioFor(card, "normale");
  $("v-audio").textContent = remix ? "♪ Écouter le remix" : "♪ Écouter l'extrait";
}
$("v-audio").addEventListener("click", () => { if (viewing) { if (muted) { toast("Le son est coupé : réactive-le en haut de la page"); return; } playCardAudio(viewing.card, 0, viewing.variant); } });
function closeViewer() { stopCardAudio(); $("viewer").hidden = true; viewing = null; document.body.style.overflow = ""; }
$("v-close").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", e => { if (e.target === $("viewer")) closeViewer(); });
(() => {
  const big = $("v-card");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  big.addEventListener("pointermove", e => {
    const r = big.getBoundingClientRect();
    const px = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1), py = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
    const foil = big.querySelector(".foil"); if (foil) { foil.style.animation = "none"; foil.style.setProperty("--px", (px * 100) + "%"); }
    if (reduce) return;
    big.classList.add("live");
    big.style.setProperty("--ry", ((px - .5) * 20) + "deg");
    big.style.setProperty("--rx", ((.5 - py) * 20) + "deg");
  });
  const reset = () => { big.classList.remove("live"); big.style.setProperty("--rx", "0deg"); big.style.setProperty("--ry", "0deg"); const foil = big.querySelector(".foil"); if (foil) foil.style.animation = ""; };
  ["pointerleave", "pointerup", "pointercancel"].forEach(ev => big.addEventListener(ev, reset));
})();
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("viewer").hidden) closeViewer();
  else if (session) { session.phase === "summary" ? closeOpening() : showSummary(); }
});

/* ================= Messages ================= */
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
/* ================= Classement ================= */
async function renderBoard() {
  try {
    const rows = await rpc("leaderboard", {});
    $("board").innerHTML = rows.map(r => `<li class="${r.pseudo === state.pseudo ? "me" : ""}"><span class="bn">${esc(r.pseudo)}</span><span class="bs">${r.cartes} / ${CARDS.length}${r.variantes ? ` · ✦ ${r.variantes}` : ""}</span></li>`).join("") || "<li><span class=\"bs\">Personne n'a encore ouvert de booster.</span></li>";
  } catch (e) {}
}
document.querySelector("#tab-collec").addEventListener("click", renderBoard);

/* ================= Offrir des boosters (droit donné par l'admin) ================= */
async function loadTargets() {
  try {
    const rows = await rpc("gift_targets", { p_token: TOKEN });
    $("gv-list").innerHTML = rows.length ? rows.map(r => `<label><input type="checkbox" value="${r.id}"><span>${esc(r.pseudo)}</span></label>`).join("") : `<p class="giver-status">Personne d'autre n'est encore inscrit.</p>`;
  } catch (e) { $("gv-status").textContent = errText(e); }
}
$("giver").addEventListener("toggle", () => { if ($("giver").open) loadTargets(); });
async function giveTo(ids) {
  const n = parseInt($("gv-count").value, 10) || 1, reason = $("gv-reason").value.trim() || "Booster offert";
  try {
    const served = await rpc("gift_as_player", { p_token: TOKEN, p_ids: ids, p_count: n, p_reason: reason });
    $("gv-status").textContent = `${n} booster${n > 1 ? "s" : ""} offert${n > 1 ? "s" : ""} à ${served} joueur${served > 1 ? "s" : ""}.`;
    document.querySelectorAll("#gv-list input:checked").forEach(c => c.checked = false);
  } catch (e) { $("gv-status").textContent = errText(e); }
}
$("gv-send").onclick = () => {
  const ids = [...document.querySelectorAll("#gv-list input:checked")].map(c => c.value);
  if (!ids.length) { $("gv-status").textContent = "Coche au moins un joueur."; return; }
  giveTo(ids);
};
let gvArmed = false;
$("gv-all").onclick = () => {
  if (!gvArmed) { gvArmed = true; $("gv-all").textContent = "Confirmer : à tout le monde"; setTimeout(() => { gvArmed = false; $("gv-all").textContent = "Offrir à tout le monde"; }, 4000); return; }
  gvArmed = false; $("gv-all").textContent = "Offrir à tout le monde"; giveTo(null);
};

/* ================= Connexion ================= */
let mode = "new";
function setMode(m) {
  mode = m;
  $("lt-new").setAttribute("aria-pressed", String(m === "new"));
  $("lt-old").setAttribute("aria-pressed", String(m === "old"));
  $("f-pin2-wrap").hidden = m !== "new";
  $("login-go").textContent = m === "new" ? "Lancer ma collec'" : "Retrouver ma collec'";
  $("f-pin").autocomplete = m === "new" ? "new-password" : "current-password";
  $("login-err").textContent = "";
}
function showLogin(msg) {
  $("login").hidden = false; document.body.style.overflow = "hidden";
  $("login-sub").textContent = msg || "Ouvre des boosters et complète l'album de la fam's.";
  $("login-tabs").hidden = false; $("login-form").hidden = false;
  setTimeout(() => $("f-pseudo").focus(), 50);
}
function hideLogin() { $("login").hidden = true; document.body.style.overflow = ""; }
$("lt-new").onclick = () => setMode("new");
$("lt-old").onclick = () => setMode("old");
$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const pseudo = $("f-pseudo").value.trim(), pin = $("f-pin").value.trim();
  const err = $("login-err"); err.textContent = "";
  if (pseudo.length < 2) { err.textContent = ERRORS.pseudo_invalide; return; }
  if (!/^\d{4}$/.test(pin)) { err.textContent = ERRORS.code_invalide; return; }
  if (mode === "new" && $("f-pin2").value.trim() !== pin) { err.textContent = "Les deux codes ne sont pas identiques."; return; }
  const go = $("login-go"); go.disabled = true;
  try {
    ac(); // débloque le son pendant ce geste
    const r = await rpc(mode === "new" ? "register" : "login", { p_pseudo: pseudo, p_pin: pin });
    if (r.error) { err.textContent = ERRORS[r.error] || "Connexion impossible."; return; }
    saveToken(r.token); applyState(r.state); hideLogin(); renderAll();
    $("f-pin").value = ""; $("f-pin2").value = "";
    toast(mode === "new" ? `Bienvenue ${state.pseudo} ! Ton premier booster t'attend.` : `Re-bonjour ${state.pseudo} !`);
  } catch (e2) { err.textContent = errText(e2); }
  finally { go.disabled = false; }
});
$("logout-btn").onclick = () => { saveToken(null); state.owned = {}; renderAll(); setMode("old"); showLogin("Connecte-toi avec ton pseudo et ton code."); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshState(); });

/* ================= Démarrage ================= */
renderSnd();
renderLegend();
showPage(location.hash.slice(1));
setMode("new");
(async () => {
  try { await loadCards(); }
  catch (e) { $("login-sub").textContent = "Impossible de charger les cartes. Vérifie ta connexion et recharge la page."; return; }
  renderAll();
  if (TOKEN) {
    try { applyState(await rpc("me", { p_token: TOKEN })); hideLogin(); renderAll(); }
    catch (e) { if (TOKEN) { $("login-sub").textContent = "Problème de connexion. Recharge la page."; return; } }
  } else showLogin();
  setInterval(renderReserve, 1000);
})();
})();
</script>
