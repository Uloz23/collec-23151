<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monome Hero</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: borne d'arcade de nuit, festive et gadz
   IDEA: la cour du tabagn's devient la piste du chant
   PICTURE: décor pixel 360x640 (Bordel's) ou 180x320 agrandi (Chalon's), notes qui tombent devant la façade
   COLOUR and TYPE: bleu nuit, pierre chaude, orange lanterne ; Press Start 2P
   LAYOUT: un seul écran de jeu centré, menus en surimpression */
:root{color-scheme:dark;--bg:#0b1030;--ink:#f6e7c6;--acc:#f3a234;--dim:#a9a3c4}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:'Press Start 2P',monospace;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;box-shadow:0 0 0 2px #26214d}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;text-align:center;background:rgba(8,10,32,.82)}
.ov[hidden]{display:none}
h1{font-size:clamp(14px,4.6vw,20px);line-height:1.5;margin:0;color:var(--acc)}
p{margin:0;font-size:10px;line-height:1.8;color:var(--dim)}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ov{gap:12px}
.home{background:transparent;justify-content:flex-start;padding-top:92%}
.home .spacer{display:none}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:60%}
button.lock{opacity:.45;border-style:dashed}
#slist{width:100%;max-width:320px;overflow-y:auto;max-height:60%;font-size:9px;text-align:left}
#slist h2{font-size:10px;color:var(--acc);margin:12px 0 6px;font-weight:400}
#slist table{width:100%;border-collapse:collapse}
#slist td{padding:3px 2px;color:var(--dim)}
#slist td.v{color:var(--ink);text-align:right}
#slist tr.fam td{color:#ffd27a;font-size:8px;padding:0 2px 5px 10px}
#mlist{width:100%;max-width:280px}
#mlist .it{display:flex;flex-direction:column;gap:5px}
#mlist .hint{font-size:8px;color:#ff9a7a;line-height:1.6}
small.lieu{color:var(--dim);font-size:8px}
button.on small.lieu{color:#6a3208}
#mlist .rec{font-size:8px;color:var(--dim)}
button.lock{opacity:.5;border-style:dashed;cursor:default}
button.mystery{opacity:.5;border-style:dashed;letter-spacing:4px;cursor:default}
#decs button,#vers button,#diffs button{padding:10px 9px;font-size:10px}
button{font:inherit;font-size:11px;color:var(--ink);background:#1d1a40;border:2px solid #4a4380;padding:12px 12px;min-height:44px;cursor:pointer}
button.on{background:var(--acc);color:#2a1606;border-color:#ffd27a}
button.go{font-size:14px;padding:14px 26px;background:#c2551f;border-color:#ffb070}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
label{font-size:9px;color:var(--dim);display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px}
input[type=range]{width:100%;accent-color:var(--acc)}
.big{font-size:22px;color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr auto;gap:8px 18px;font-size:10px;text-align:left}
.stats span:nth-child(even){text-align:right;color:var(--ink)}
.stats span:nth-child(odd){color:var(--dim)}
#pause{position:absolute;top:2px;right:2px;min-height:0;padding:6px 8px;font-size:9px;background:transparent;border:0}
</style>
</head>

<div id="wrap"><div id="stage">

  <div class="ov home" id="home">
    <div class="spacer"></div>
    <div class="col">
      <button class="go" id="hplay">Jouer</button>
      <button id="hscores">Meilleurs scores</button>
      <button id="hset">Réglages</button>
    </div>
  </div>

  <div class="ov" id="menu" hidden>
    <h1 id="mhead">Choisis un chant</h1>
    <p id="msub"></p>
    <div class="col" id="mlist"></div>
    <p id="mrec"></p>
    <button id="mback">Retour</button>
  </div>

  <div class="ov" id="scores" hidden>
    <h1>Meilleurs scores</h1>
    <div id="slist"></div>
    <button id="sback">Retour</button>
  </div>

  <div class="ov" id="settings" hidden>
    <h1>Réglages</h1>
    <label>Décalage audio : <b id="latv">0 ms</b>
      <input type="range" id="lat" min="-200" max="300" step="10" value="0">
      <span>Augmente-le si tu tapes toujours trop tard (écouteurs Bluetooth surtout)</span>
    </label>
    <div class="row"><button id="vib">Vibrations : oui</button></div>
    <div class="row"><button id="reset">Effacer la progression</button></div>
    <p id="resetmsg"></p>
    <button id="tback">Retour</button>
  </div>

  <div class="ov" id="paused" hidden>
    <h1>Pause</h1>
    <div class="row"><button class="go" id="resume">Reprendre</button><button id="quit">Quitter</button></div>
  </div>

  <div class="ov" id="end" hidden>
    <h1 id="etitle">Fin du chant</h1>
    <div class="big" id="escore">0</div>
    <div class="stats" id="estats"></div>
    <div class="row"><button class="go" id="again">Rejouer</button><button id="tomenu">Menu</button></div>
  </div>
</div></div>

const ZN=7,ZX=180,ZY=397,ZA=132,ZB=85,ZBOX=[44,310,272,174];

function buildZamat(){
  try{
    const o=document.createElement('canvas');o.width=360;o.height=640;const c=o.getContext('2d');c.drawImage(imgB,0,0);
    const [bx,by,bw,bh]=ZBOX,p=c.getImageData(bx,by,bw,bh).data;
    zPix=new Int16Array(bw*bh).fill(-1);zLum=new Float32Array(bw*bh);
    for(let j=0;j<bh;j++)for(let i=0;i<bw;i++){
      const x=bx+i,y=by+j,P=(x-ZX)/ZA,Q=(y-ZY)/ZB,u=(P+Q+1)/2*ZN,v=(Q-P+1)/2*ZN;
      if(u<0||v<0||u>=ZN||v>=ZN)continue;
      const k=(j*bw+i)*4,r=p[k],g2=p[k+1];
      if(!((r>165&&g2>120)||(r>100&&g2<105&&r-g2>40)))continue;
      zPix[j*bw+i]=Math.floor(u)*ZN+Math.floor(v);zLum[j*bw+i]=(r+g2+p[k+2])/765;
    }

const zI=new Float32Array(49),zC=new Array(49);
function zamatFX(t,ph,env){
  if(!zPix||combo<3)return;
  const bk=beatN(t),half=Math.floor(t/(60/data.tempo)*2);
  for(let i=0;i<ZN;i++)for(let j=0;j<ZN;j++){
    const id=i*ZN+j,par=(i+j)%2,dist=Math.hypot(i-3,j-3)/4.25;
    let a=0,col=TINTS[0];
    if(combo<15)a=par===0?env*.75:env*.25;
    else if(combo<30)a=md(par+bk,2)===0?.25+env*.75:.05;
    else{
      const w=Math.max(0,1-Math.abs(dist-ph*1.5)*3.2);
      a=w*.95+(md(par+bk,2)===0?env*.4:0);
      if(combo>=50){col=TINTS[1+md(bk+((i+j)>>1),4)];const w2=Math.max(0,1-Math.abs((i-j+7)/14-ph)*5);a=Math.max(a,w2*.8)}
      if(combo>=100&&md(id*37+half*11,9)<2){a=1;col=TINTS[5]}
    }
    zI[id]=Math.min(1,a);zC[id]=col;
  }
  const d=zImg.data;
  for(let k=0;k<zPix.length;k++){
    const id=zPix[k],q=k*4;
    if(id<0){d[q+3]=0;continue}
    const a=zI[id],c=zC[id],l=.55+.45*zLum[k];
    d[q]=c[0]*l*a;d[q+1]=c[1]*l*a;d[q+2]=c[2]*l*a;d[q+3]=255;
  }
  zCtx.putImageData(zImg,0,0);
  g.globalCompositeOperation='lighter';g.globalAlpha=.85;g.drawImage(zCan,ZBOX[0],ZBOX[1]);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

    lastBk=bkNow;
    if(dec==='bordels')BARRELS.forEach((b,i)=>{
      const tg=combo>=b.ign?.3+.7*Math.min(1,(combo-b.ign)/50):0;
      fl[i]+=(tg-fl[i])*Math.min(1,dt*(tg>fl[i]?5:1.6));
      if(fl[i]>.4&&Math.random()<dt*fl[i]*9)parts.push({x:(b.x+(Math.random()-.5)*b.rx*1.4)/2,y:(b.y-8)/2,vx:(Math.random()-.5)*10,vy:-16-Math.random()*26,life:.6+Math.random()*.7,g:-4,c:Math.random()<.5?'#ffb43a':'#ff7a2a'});
    });
    if(combo>=50)clockSpin+=dt*(6+Math.min(30,(combo-50)/4));
    shake=Math.max(0,shake-dt);if(judg)judg.t+=dt;if(banner)banner.t+=dt;
  }

  g.setTransform(1,0,0,1,0,0);
  g.save();
  if(shake>0)g.translate(Math.round((Math.random()-.5)*8),Math.round((Math.random()-.5)*6));
  if(state==='home'){drawHome(ts/1000);g.restore();requestAnimationFrame(loop);return}
  const base=dec==='bordels'?imgB:dec==='boquette'?imgQ:dec==='cluns'?imgK:dec==='birse'?imgS:imgC;
  if(base.complete)g.drawImage(base,0,0,360,640);else{g.fillStyle='#0b1030';g.fillRect(0,0,360,640)}

  if(playing){
    if(dec==='bordels'){
      if(layersB&&t>0)lights(layersB,BWIN,t,ph,env);
      if(t>0)zamatFX(t,ph,env);
      {const heat=Math.min(1,combo/60);g.fillStyle='rgba(255,190,90,'+(.06+heat*.1+env*Math.min(1,combo/20)*.12).toFixed(3)+')';
       for(let r=10+heat*14;r>2;r-=5){g.beginPath();g.arc(LAMP[0],LAMP[1],r,0,7);g.fill()}}
      BARRELS.forEach((b,i)=>{
        const L=fl[i];if(L<.03)return;
        g.fillStyle='rgba(255,150,40,'+(.05*L*(1+1.6*env)).toFixed(3)+')';
        for(let k=3;k>=1;k--){g.beginPath();g.ellipse(b.x,b.bot-2,b.rx*(1+k*.9),b.rx*(.3+k*.28),0,0,7);g.fill()}
      });
    }else if(dec==='birse'){
      if(layersS&&t>0)lights(layersS,SWIN,t,ph,env);
      ateliersFX(t,state==='play'?dt:0,env,state==='play'&&sNewBeat);
    }else if(dec==='cluns'){
      if(layersK&&t>0)lights(layersK,KWIN,t,ph,env);
      for(let a=0;a<KARCH.length;a++){const L=wl[a];if(L<.03)continue;const [x,y,w]=KARCH[a];
        g.fillStyle='rgba(255,170,70,'+((.07+.2*env)*L).toFixed(3)+')';
        for(let k=2;k>=1;k--){g.beginPath();g.ellipse(x+w/2,392,w*(.45+k*.3),2+k*2,0,0,7);g.fill()}}
    }else if(dec==='boquette'){
      if(layersQ&&t>0)lights(layersQ,QWIN,t,ph,env);
      for(let a=0;a<8;a++){const L=wl[a];if(L<.03)continue;const [x,y,w]=QWIN[a];
        g.fillStyle='rgba(255,170,70,'+((.08+.22*env)*L).toFixed(3)+')';
        for(let k=2;k>=1;k--){g.beginPath();g.ellipse(x+w/2,372,w*(.5+k*.35),3+k*3,0,0,7);g.fill()}}
    }else{
      if(layersC&&t>0)lights(layersC,CWIN2,t,ph,env);
      clock2(data?Math.max(0,t/data.duree):0);
      const heat=Math.min(1,combo/60);
      g.fillStyle='rgba(255,176,64,'+(.08+heat*.12+(t>0?env:0)*Math.min(1,combo/20)*.15).toFixed(3)+')';
      for(let r=24+heat*30;r>4;r-=8){g.beginPath();g.arc(180,368,r,0,7);g.fill()}
    }
    g.save();g.scale(2,2);
    for(let i=0;i<3;i++){
      g.fillStyle='rgba(6,8,28,.38)';g.fillRect(LX[i]-13,0,26,HITY+10);
      if(beam[i]>0){g.globalAlpha=beam[i]*.45;g.fillStyle=COL[i];g.fillRect(LX[i]-10,0,20,HITY);g.globalAlpha=1}
    }
    g.restore();
    G_ANIM=true;
    if(dec==='bordels')frontB(t,pulse,env);
    if(dec==='chalons'){if(mono>0)frontCB(t,pulse);if(t>0)logoFX(t,ph,env)}
    if(dec==='boquette'){if(t>0)clochetonFX(t,ph,env);if(mono>0)frontQB(t,pulse)}
    if(dec==='cluns'){if(mono>0)frontKB(t,pulse);rosaceFX(t>0?t:0,ph,env)}
    if(dec==='birse'){statueFX(t>0?t:0,ph,env);if(mono>0)frontSB(t,pulse)}
    drawLeavers(state==='play'?dt:0);G_ANIM=false;

    g.save();g.scale(2,2);
    g.fillStyle=pulse?'#ffe2a0':'#b89a70';g.fillRect(28,HITY,124,1);
    for(let i=0;i<3;i++){
      blob(LX[i],HITY,22,12,pulse?'#ffe2a0':'#cdb48a');
      blob(LX[i],HITY,18,8,press[i]>0||holding[i]?LIG[i]:'#1b1636');
    }
    for(const n of notes){
      const y=HITY-(n.t-t)/ap*HITY;if(y<-10)break;
      if(n.d&&(!n.j||n.hold||n.broke)){
        const ye=Math.round(HITY-(n.t+n.d-t)/ap*HITY),yh=Math.round(n.hold?HITY:y);
        if(yh>ye&&ye<H){
          const x=LX[n.c];g.fillStyle=n.broke?'#3a3648':DRK[n.c];g.fillRect(x-3,ye,6,yh-ye);
          g.fillStyle=n.broke?'#5c5870':(n.hold&&Math.random()<.5?LIG[n.c]:COL[n.c]);g.fillRect(x-1,ye,2,yh-ye);
          blob(x,ye,8,6,n.broke?'#5c5870':COL[n.c]);
        }
      }
      if(!n.j&&y<=H)note(LX[n.c],y,n.c);
    }
    for(const p of pops){const f=p.t/.16;note(p.x,HITY,p.l,18+f*14,10-f*5)}
    for(const p of parts){g.fillStyle=p.c;const s=p.life>.3?2:1;g.fillRect(Math.round(p.x),Math.round(p.y),s,s)}

    g.fillStyle='rgba(8,8,30,.82)';g.fillRect(0,0,W,15);
    txt(score.toLocaleString('fr-FR').replace(/\s/g,' '),4,4,'#f6e7c6',8,'left');
    txt(combo>1?combo+' x'+mult():'',W-22,4,combo>=25?'#ffb43a':'#f6e7c6',8,'right');
    g.fillStyle='rgba(8,8,30,.7)';g.fillRect(0,15,W,10);
    txt('Monôme : '+mono+' gadz',90,17,mono>=150?'#ffb43a':'#cfc8e8',8);
    if(judg&&judg.t<.55){
      const k=judg.k,s=judg.s;let label=JTXT[k],c=JCOL[k];
      if(k==='p'&&s>=3){label='Parfait x'+s;c=STREAK[Math.floor(s/3)%STREAK.length];}
      const bounce=judg.t<.08?-2:0;
      txt(label,90,(dec==='birse'?168:200)-Math.round(judg.t*12)+bounce,c,8);
    }
    if(banner&&banner.t<1.1)txt(banner.txt,90,40,'#ffb43a',8);
    if(t<0)txt(String(Math.ceil(-t)),90,130,'#ffe066',16);
    const pr=data?Math.max(0,Math.min(1,t/data.duree)):0;
    g.fillStyle='#26214d';g.fillRect(0,H-3,W,3);g.fillStyle='#f3a234';g.fillRect(0,H-3,Math.round(W*pr),3);
    g.restore();
  }
  g.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
