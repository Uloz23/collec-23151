<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Duel 23-151</title>
<link rel="icon" href="assets/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="carte.css?v=1">
<style>
@font-face { font-family: "Zagots"; src: url(assets/zagots.ttf) format("truetype"); font-display: block; }
/* Plateau de jeu sombre façon Collec' : bordeaux profond, or, parchemin. L'adversaire en haut, toi en bas, la main en pied d'écran. */
:root {
  color-scheme: dark;
  --nuit: #140b0b; --board: #1f1213; --felt: #2a1719; --line: rgba(232, 200, 130, .18);
  --gold: #d9b45f; --gold-soft: #f1dfae; --parch: #efe4c9; --muted: #a8977a; --good: #7fd29a; --warn: #f0a868; --bad: #e86d6d;
  --t-gadz: #6d1f2a; --t-tab: #24435c; --t-chant: #4c2a63; --t-trad: #2c5236; --t-manip: #7a4317; --t-proche: #5a3b2e;
  --wine: #5e1424; --wine-deep: #3a0b16; --parchment: #efe4cc; --ink: #2a1a14; --fams: #6c609d; --fams-soft: #b9adef;
  --f-gadz: "Zagots", "IM Fell English SC", Georgia, serif; --f-label: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: Barlow, system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--nuit); color: var(--parch); font-family: var(--f-body); margin: 0; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nuit); }
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto auto auto; max-width: 720px; margin: 0 auto; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-block: 6px 0; gap: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Bandeaux joueurs */
.hud { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; background: var(--board); border: 1px solid var(--line); }
.hud .nom { font-family: var(--f-gadz); font-size: 20px; color: var(--muted); }
.hud.actif { border-color: var(--gold); box-shadow: 0 0 14px rgba(217,180,95,.25); } .hud.actif .nom { color: var(--gold-soft); }
.hud .chip { font-size: 12px; }
.hud .pts { margin-left: auto; display: flex; align-items: baseline; gap: 4px; font-family: var(--f-label); }
.hud .pts b { font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
.hud .pts small { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 6px; font-family: var(--f-label); font-size: 13px; color: var(--muted); letter-spacing: .04em; flex-wrap: wrap; }
.chip { padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.chip.on { color: var(--parch); border-color: var(--gold); }
.barre { height: 4px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
.barre i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #f7dc96); transition: width .4s; }

/* Plateau */
.plateau { min-height: 0; overflow-y: auto; display: grid; padding-inline: 4px !important; grid-template-rows: minmax(min-content, 1fr) auto minmax(min-content, 1fr); gap: 6px; padding: 6px; border-radius: 14px; background: radial-gradient(ellipse at 50% 50%, var(--felt), var(--board) 75%); border: 1px solid var(--line); }
.zone { display: flex; flex-wrap: wrap; gap: 7px 4px; align-content: flex-start; justify-content: center; min-height: 74px; padding: 3px 0 7px; }
.zone.adv { align-content: safe flex-end; }
.zone .vide { align-self: center; font-family: var(--f-label); color: var(--muted); font-size: 14px; letter-spacing: .06em; }
.milieu { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 4px 2px; border-block: 1px dashed var(--line); }
.tabslot { width: 62px; display: grid; gap: 2px; justify-items: center; font-family: var(--f-label); font-size: 10px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.tabslot .slot { width: 58px; height: 34px; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; text-align: center; font-family: var(--f-gadz); font-size: 13px; color: var(--parch); text-transform: none; letter-spacing: 0; padding: 2px; }
.tabslot .slot.plein { border-style: solid; background: var(--t-tab); border-color: #6c93b3; cursor: pointer; }
.journal { font-size: 12.5px; line-height: 1.35; color: var(--muted); display: grid; gap: 1px; min-width: 0; text-align: center; }
.journal div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.journal div:last-child { color: var(--parch); }
.journal .pts { color: var(--gold-soft); }

/* Cartes */
.c { --tc: var(--t-gadz); position: relative; width: 70px; height: 96px; border-radius: 9px; padding: 5px 5px 4px; display: grid; grid-template-rows: auto 1fr auto; gap: 2px; text-align: left;
  background: linear-gradient(170deg, color-mix(in srgb, var(--tc) 85%, #fff 8%), color-mix(in srgb, var(--tc) 70%, #000)); border: 1.5px solid color-mix(in srgb, var(--tc) 50%, var(--gold)); box-shadow: 0 4px 10px rgba(0,0,0,.45); transition: transform .25s, filter .25s, box-shadow .2s; flex: none; }
.c[data-t="Tabagn's"] { --tc: var(--t-tab); } .c[data-t="Chant"] { --tc: var(--t-chant); } .c[data-t="Trad's"] { --tc: var(--t-trad); } .c[data-t="Manip'"] { --tc: var(--t-manip); } .c.proche { --tc: var(--t-proche); }
.c .nm { font-family: var(--f-gadz); font-size: 13px; line-height: 1.05; color: var(--gold-soft); overflow-wrap: anywhere; padding-right: 14px; }
.c .tx { font-size: 9.5px; line-height: 1.2; color: rgba(239,228,201,.82); overflow: hidden; min-height: 0; -webkit-mask-image: linear-gradient(#000 65%, transparent); mask-image: linear-gradient(#000 65%, transparent); }
.c .ft { display: flex; justify-content: space-between; font-family: var(--f-label); font-size: 11px; letter-spacing: .05em; color: var(--gold-soft); }
.c .cost { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-label); font-weight: 700; font-size: 14px; color: #2a1606; background: radial-gradient(circle at 35% 30%, #fff1c2, var(--gold) 60%, #9a7428); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.c .rar { width: 6px; height: 6px; border-radius: 50%; background: #9a9a9a; align-self: center; flex: none; }
.c .rar.peu-commune { background: #8fc6e8; } .c .rar.rare { background: #e8c35c; } .c .rar.mythique { background: #e8606a; box-shadow: 0 0 6px #e8606a; }
.c.engage { transform: rotate(-9deg) translateY(4px); filter: saturate(.35) brightness(.72); }
/* Jetons compacts dans les zones de manip' : nom, prom's et état seulement (touche pour l'effet complet) */
.c.mini { width: 44px; height: 58px; padding: 4px 4px 3px; border-radius: 7px; grid-template-rows: 1fr auto; gap: 0; }
.c.mini .tx, .c.mini .cost { display: none; }
.c.mini .nm { font-size: 10.5px; line-height: 1.02; padding-right: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.c.mini .ft { font-size: 11.5px; font-weight: 600; color: var(--parch); }
.c.mini .ft .rar { width: 5px; height: 5px; }
.c.mini.engage { transform: translateY(5px) scale(.94); filter: saturate(.25) brightness(.62); }
.c.mini .tag { font-size: 8.5px; padding: 0 4px; bottom: -6px; }
.c.mini .recus { top: auto; bottom: 14px; right: 3px; font-size: 9px; }
.zone.serre .c.mini { width: 42px; height: 56px; } .zone.serre .c.mini .nm { font-size: 9.5px; } .zone.serre .c.mini .ft { font-size: 10px; }
.c .tag { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); padding: 1px 6px; border-radius: 999px; font-family: var(--f-label); font-size: 10px; letter-spacing: .06em; background: var(--nuit); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.c .tag.new { color: var(--warn); border-color: var(--warn); }
.c .tag.crap { color: var(--bad); border-color: var(--bad); }
.c .recus { position: absolute; top: 4px; right: 4px; font-family: var(--f-label); font-size: 10px; color: var(--gold); }
.c.cible { box-shadow: 0 0 0 3px var(--good), 0 0 18px rgba(127,210,154,.6); animation: pulse 1.1s infinite; }
.c.choisi { box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(217,180,95,.6); }
.c.jouable { box-shadow: 0 0 0 2px rgba(217,180,95,.85), 0 4px 10px rgba(0,0,0,.45); }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--good), 0 0 6px rgba(127,210,154,.3); } }
@media (prefers-reduced-motion: reduce) { .c, .barre i { transition: none; } .c.cible { animation: none; } }

/* Ressources + main + actions */
.res { display: flex; align-items: center; gap: 8px; font-family: var(--f-label); font-size: 14px; color: var(--muted); padding: 0 4px; min-height: 22px; flex-wrap: wrap; }
.res b { color: var(--gold-soft); font-size: 17px; font-variant-numeric: tabular-nums; }
.res .hint { margin-left: auto; color: var(--parch); }
.main { display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px 10px; scrollbar-width: thin; }
.main .c { width: 72px; height: 98px; }

.actions { display: flex; gap: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.btn { flex: 1; padding: 11px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--board); font-family: var(--f-label); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; color: var(--parch); }
.btn.go { background: linear-gradient(180deg, #e7c46d, #b88c32); color: #241404; border-color: #e7c46d; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }

/* Feuilles (fiche carte, choix, réaction) */
.voile { position: fixed; inset: 0; background: rgba(8,4,4,.6); z-index: 20; display: grid; align-items: end; justify-items: center; }
.feuille { width: min(720px, 100%); max-height: 86%; overflow-y: auto; background: var(--board); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding-top: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; display: grid; gap: 12px; box-shadow: 0 -10px 40px rgba(0,0,0,.6); }
.feuille h2 { margin: 0; font-family: var(--f-gadz); font-weight: 400; font-size: 28px; color: var(--gold-soft); }
.feuille .sous { font-family: var(--f-label); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
.feuille p { margin: 0; line-height: 1.45; max-width: 62ch; }
.feuille .row { display: flex; gap: 8px; flex-wrap: wrap; }
.feuille .row .btn { flex: 1 1 140px; }
.grille { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 4px 0 8px; }
.jauge { height: 8px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; }
.jauge i { display: block; height: 100%; background: linear-gradient(90deg, var(--bad), var(--warn), var(--gold)); width: 100%; }
.regles { display: grid; gap: 10px; font-size: 14.5px; line-height: 1.45; }
.regles h3 { margin: 6px 0 0; font-family: var(--f-label); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.regles ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.opts { display: grid; gap: 8px; }
.opts label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; }
.opts input { accent-color: #c9a24e; margin-top: 3px; }
.log-full { font-size: 13.5px; line-height: 1.45; display: grid; gap: 2px; }
.log-full .tour { color: var(--gold); margin-top: 6px; font-family: var(--f-label); letter-spacing: .06em; }
.log-full .pts { color: var(--gold-soft); } .log-full .warn { color: var(--warn); } .log-full .fin { color: var(--good); font-weight: 600; }
.fin h2 { font-size: 34px; }

/* Animations */
.scene { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
.vitrine { position: fixed; inset: 0; z-index: 16; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, rgba(10,5,5,.55), rgba(10,5,5,.25) 60%, transparent); animation: voile-in .2s ease-out; }
.vitrine .qui { position: absolute; top: 18%; font-family: var(--f-label); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.vitrine .c { width: 168px; height: 232px; padding: 12px 11px 10px; border-radius: 14px; animation: vitrine-in .45s cubic-bezier(.2,.9,.3,1.25) both; box-shadow: 0 20px 50px rgba(0,0,0,.7), 0 0 30px rgba(217,180,95,.35); }
.vitrine .c .nm { font-size: 22px; } .vitrine .c .tx { font-size: 13.5px; -webkit-mask-image: none; mask-image: none; } .vitrine .c .ft { font-size: 14px; } .vitrine .c .cost { width: 34px; height: 34px; font-size: 20px; top: -10px; right: -10px; }
.vitrine.sort .c { animation: vitrine-out .35s ease-in both; }
.vitrine.sort { animation: voile-out .35s ease-in both; }
@keyframes vitrine-in { from { transform: translateY(var(--dy, 120px)) scale(.45) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes vitrine-out { to { transform: translateY(var(--dy2, -60px)) scale(.4); opacity: 0; } }
@keyframes voile-in { from { opacity: 0; } } @keyframes voile-out { to { opacity: 0; } }
.c.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both; }
@keyframes pop { from { transform: translateY(var(--dy, 40px)) scale(.3); opacity: 0; } }
.c.tuy-anc { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(217,180,95,.8); z-index: 3; }
.c.tuy-jeune { box-shadow: 0 0 0 3px var(--good), 0 0 22px rgba(127,210,154,.8); z-index: 3; }
.scene path { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(217,180,95,.9)); stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: trace .55s ease-out forwards; }
.scene circle { fill: #fff6d8; filter: drop-shadow(0 0 6px #f1dfae); }
@keyframes trace { to { stroke-dashoffset: 0; } }
.flottant { position: fixed; z-index: 17; transform: translate(-50%, -50%); font-family: var(--f-label); font-weight: 700; font-size: 30px; color: var(--gold-soft); text-shadow: 0 2px 8px rgba(0,0,0,.8), 0 0 14px rgba(217,180,95,.8); pointer-events: none; animation: monte 1.2s ease-out forwards; }
@keyframes monte { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
.hud .pts b.bump { animation: bump .6s ease-out; }
@keyframes bump { 30% { transform: scale(1.45); color: #fff1c2; } }
@media (prefers-reduced-motion: reduce) { .vitrine .c, .c.pop, .scene path, .flottant, .hud .pts b.bump { animation-duration: .01s; } }

/* ---- Vraies cartes de la Collec' (photos, versions) ---- */
.cv { position: relative; flex: none; width: 76px; padding: 0; border: 0; background: none; border-radius: 6px; transition: transform .2s, box-shadow .2s; }
.cv .card { width: 100%; }
.cv .cost { position: absolute; top: -7px; right: -7px; z-index: 6; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-label); font-weight: 700; font-size: 15px; color: #2a1606; background: radial-gradient(circle at 35% 30%, #fff1c2, var(--gold) 60%, #9a7428); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.cv.jouable { box-shadow: 0 0 0 2px rgba(217,180,95,.95), 0 0 14px rgba(217,180,95,.5); }
.cv.choisi { box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(217,180,95,.6); }
.vitrine .cv { width: 200px; animation: vitrine-in .45s cubic-bezier(.2,.9,.3,1.25) both; box-shadow: 0 20px 50px rgba(0,0,0,.7); }
.vitrine.sort .cv { animation: vitrine-out .35s ease-in both; }
.vitrine .effet { position: absolute; top: calc(50% + 150px); width: min(320px, 86vw); padding: 10px 14px; border-radius: 12px; background: rgba(20,11,11,.92); border: 1px solid var(--line); text-align: center; font-size: 14.5px; line-height: 1.4; color: var(--parch); animation: voile-in .3s .2s both; }
.fiche-haut { display: flex; gap: 14px; align-items: flex-start; }
.fiche-haut .cv { width: 128px; }
.fiche-haut .txt { display: grid; gap: 8px; min-width: 0; }
/* Jeton avec photo dans la zone de manip' */
.c.mini.photo { background: linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(10,4,4,.88) 78%), var(--img) center 22% / cover, var(--t-gadz); }
.c.mini.photo .nm { color: #fff; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
.c.mini.jv-brillante { border: 2px solid transparent; background: linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(10,4,4,.88) 78%) padding-box, var(--img) center 22% / cover padding-box, linear-gradient(115deg, #ff4fa3, #ffb23f, #f4f04a, #3ef08f, #3fc8ff, #c46bff) border-box; box-shadow: 0 0 8px rgba(160,200,255,.6); }
.c.mini.jv-doree { border: 2px solid #f6d77a; box-shadow: 0 0 0 1px #8a6420, 0 0 12px rgba(255,205,90,.75); }
.c.mini.jv-textless { border: 2px solid #f1dfae; }
.c.mini.jv-doree .nm { color: #fff1c2; }
.chip.kj { background: none; color: inherit; cursor: pointer; font: inherit; }
.chip.kj:hover { border-color: var(--gold); color: var(--parch); }
/* Taille des cartes selon la place disponible (largeur et hauteur de l'écran) */
:root { --jw: clamp(44px, min(6vw, 8.6vh), 104px); --mw: clamp(72px, min(9.5vw, 15vh), 150px); }
.c.mini { width: var(--jw); height: calc(var(--jw) * 1.31); }
.c.mini .nm { font-size: calc(var(--jw) * .235); } .c.mini .ft { font-size: calc(var(--jw) * .26); }
.zone.serre .c.mini { width: calc(var(--jw) * .88); height: calc(var(--jw) * 1.17); }
.cv, .main .cv { width: var(--mw); }
.main { min-height: calc(var(--mw) * 1.4 + 18px); }
@media (min-width: 700px) and (min-height: 600px) {
  .app { max-width: 1280px; gap: 8px; }
  .zone { gap: 10px 8px; }
  .main { gap: 12px; }
  .grille .cv { width: 130px; }
  .fiche-haut .cv { width: 200px; }
  .vitrine .cv { width: min(280px, 34vh); } .vitrine .effet { top: calc(50% + min(200px, 24vh)); font-size: 16px; width: min(420px, 86vw); }
  .hud .nom { font-size: 24px; } .hud .pts b { font-size: 30px; }
  .journal { font-size: 14px; }
  .tabslot { width: 90px; } .tabslot .slot { width: 84px; height: 44px; font-size: 15px; }
  .feuille { max-width: 900px; }
}
.compte { font-family: var(--f-label); font-size: 13px; color: var(--muted); letter-spacing: .04em; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hud" id="hud-ia"></div>
  <div class="barre" aria-hidden="true"><i id="bar-ia" style="width:0"></i></div>
  <div class="plateau">
    <div class="zone adv" id="zone-ia" aria-label="Zone de manip' de l'IA"></div>
    <div class="milieu">
      <div class="tabslot"><span>IA</span><div class="slot" id="tab-ia">vide</div></div>
      <div class="journal" id="journal" aria-live="polite"></div>
      <div class="tabslot"><span>Toi</span><div class="slot" id="tab-moi">vide</div></div>
    </div>
    <div class="zone" id="zone-moi" aria-label="Ta zone de manip'"></div>
  </div>
  <div class="hud" id="hud-moi"></div>
  <div class="res" id="res"></div>
  <div class="main" id="main" aria-label="Ta main"></div>
  <div class="actions">
    <button class="btn" id="b-regles" type="button">Règles</button>
    <button class="btn" id="b-journal" type="button">Journal</button>
    <button class="btn go" id="b-fin" type="button">Fin du tour</button>
  </div>
</div>
<div id="voiles"></div>

<script src="config.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="carte.js?v=1"></script>
<script src="jeu/cartes.js?v=4"></script>
<script src="jeu/moteur.js?v=4"></script>
<script>
const M = window.Moteur;
const $ = id => document.getElementById(id);
let g = null, mode = null, occupe = false, reglages = { arrivee: "A", cible: 23, mesCartes: false };

// ---------- Cartes et collection de la Collec' ----------
const CFG = window.COLLEC_CFG;
const SB = window.supabase && CFG ? window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false } }) : null;
const media = path => !path ? null : /^(https?|data|blob):/.test(path) ? path : `${CFG.url}/storage/v1/object/public/${CFG.bucket}/${path}`;
const RLABEL = { "gadz": "Gadz", "commune": "Commune", "peu-commune": "Peu commune", "rare": "Rare", "mythique": "Mythique" };
let CARDS = [], DB = {}, OWNED = {}, PSEUDO = null;
const Rendu = window.CarteRendu({ total: () => CARDS.length, hasAudio: c => !!c.audio, RLABEL });
function mapCard(c) {
  return ({
    id: c.id, name: c.name, type: c.type, sub: c.sub || "", colors: { bg: /^#[0-9a-f]{6}$/i.test(c.color_bg || "") ? c.color_bg : null, fg: /^#[0-9a-f]{6}$/i.test(c.color_fg || "") ? c.color_fg : null }, kind: (c.kind || "").trim(), fams: c.fams || "", rarity: c.rarity,
    art: c.art || "trad", hue: c.hue ?? 30, text: c.text || "",
    photo: (c.photo_normale || c.photo_textless) ? { normale: media(c.photo_normale || c.photo_textless), textless: media(c.photo_textless || c.photo_normale) } : null,
    audio: null

}
const promOf = c => { const s = c.sub || ""; if (s.startsWith(".")) return 1e6; const m = /(\d+)\s*$/.exec(s); return m ? +m[1] : -1; };
function sortCards(list) {
  const TYPE_ORDER = ["Gadz", "Tabagn's", "Chant", "Trad's", "Manip'"];
  const t = c => { const i = TYPE_ORDER.indexOf(c.type); return i < 0 ? 99 : i; };
  const r = c => { const i = ["commune", "peu-commune", "rare", "mythique"].indexOf(c.rarity); return i < 0 ? 9 : i; };
  return list.slice().sort((a, b) => t(a) - t(b) || (a.type === "Gadz"
    ? promOf(b) - promOf(a) || (a.kind ? 1 : 0) - (b.kind ? 1 : 0) || a.id - b.id
    : r(a) - r(b) || a.name.localeCompare(b.name, "fr", { sensitivity: "base", numeric: true }) || a.id - b.id));
}
async function charger() {
  if (!SB) return;
  try {
    const { data, error } = await SB.from("cards").select("*").order("id");
    if (error) throw error;
    CARDS = sortCards(data.filter(c => c.published !== false).map(mapCard)); CARDS.forEach((c, i) => { c.num = i + 1; });
    DB = Object.fromEntries(CARDS.map(c => [c.id, c]));
  } catch (e) { console.warn("Cartes indisponibles", e); }
  let token = null; try { token = localStorage.getItem("collec23151-token"); } catch (e) {}
  if (token) {
    try { const me = (await SB.rpc("me", { p_token: token })).data; if (me) { PSEUDO = me.pseudo; (me.owned || []).forEach(([cid, v, n]) => { OWNED[cid + ":" + v] = n; }); } } catch (e) {}
  }
}
// Ton exemplaire le plus beau de chaque carte (dorée > full art > brillante > normale) ; l'IA joue en normale
const VBEST = ["doree", "textless", "brillante", "normale"];
const possede = id => VBEST.reduce((s, v) => s + (OWNED[id + ":" + v] || 0), 0);
const versionDe = c => { if (c.owner !== 0) return "normale"; for (const v of VBEST) if (OWNED[c.def.id + ":" + v]) return v; return "normale"; };
// Deck tiré dans ta collection : 2 exemplaires max, autant que tu en possèdes
function deckCollection() {
  const R = M.rngFrom(Date.now() & 0xffffff), dispo = [];
  M.CARTES.forEach(c => { const n = Math.min(2, possede(c.id)); for (let k = 0; k < n; k++) dispo.push(c); });
  const gadz = dispo.filter(c => c.type === "Gadz"), autres = dispo.filter(c => c.type !== "Gadz");
  const tire = (l, n) => { const a = l.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
  const nG = Math.min(gadz.length, 17), tabs = tire(autres.filter(c => c.type === "Tabagn's"), 2), reste = autres.filter(c => c.type !== "Tabagn's");
  const deck = [...tire(gadz, nG), ...tabs, ...tire(reste, 30 - nG - tabs.length)];
  return deck.length >= 30 && nG >= 12 ? deck.map(c => c.id) : null;
}
try { const r = JSON.parse(localStorage.getItem("duel23151-reglages") || "null"); if (r) reglages = { ...reglages, ...r }; } catch (e) {}
const moi = () => g.joueurs[0], ia = () => g.joueurs[1];
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const pause = ms => new Promise(r => setTimeout(r, ms));
const promTxt = d => d.conscrit ? ".onscrit" : d.proche ? d.proche : d.type === "Gadz" ? "Bo" + d.prom : d.type;

// ---------- Rendu d'une carte ----------
function carteEl(c, opts = {}) {
  const db = DB[c.def.id];
  if (db && opts.mini) return jetonEl(c, db, opts);
  if (db && !opts.mini) return vraieEl(c, db, opts);
  return carteJeu(c, opts);
}
// Vraie carte de la Collec', dans la version que tu possèdes
function vraieEl(c, db, opts) {
  const b = document.createElement("button"); b.type = "button"; b.className = "cv"; b.dataset.uid = c.uid;
  b.appendChild(Rendu.cardEl(db, versionDe(c)));
  const k = opts.cout != null ? opts.cout : (c.def.type === "Gadz" ? (c.def.cost || null) : c.def.cost);
  if (k) b.insertAdjacentHTML("afterbegin", `<span class="cost">${k}</span>`);
  b.setAttribute("aria-label", `${c.def.name}, ${c.def.type}`);

}
// Jeton compact avec la photo, pour la zone de manip'
function jetonEl(c, db, opts) {

  const ph = Rendu.photoOf(db), v = versionDe(c);
  if (ph) { b.classList.add("photo"); b.style.setProperty("--img", `url("${(v === "textless" || v === "doree") && ph.textless ? ph.textless : ph.normale}")`); }
  if (v !== "normale") b.classList.add("jv-" + v);

}
function carteJeu(c, opts = {}) {
  const d = c.def, b = document.createElement("button");
  b.type = "button"; b.className = "c" + (d.proche ? " proche" : "") + (c.engage ? " engage" : "");

// ---------- Rendu général ----------
function hud(p, el) {
  const o = g.joueurs[1 - p.i];
  el.classList.toggle("actif", g.actif === p.i && !g.fini);
  el.innerHTML = `<span class="nom">${esc(p.nom)}</span><span class="chips"><span class="chip">Main ${p.main.length}</span><span class="chip">Pioche ${p.pioche.length}</span><button class="chip kj" type="button" data-kjib="${p.i}">K'jib ${p.kjib.length}</button></span><span class="pts"><b>${p.points}</b><small>/ ${g.opts.cible}</small></span>`;
}
let ptsAff = [0, 0];
function rendre() {
  if (!g) return;
  hud(ia(), $("hud-ia")); hud(moi(), $("hud-moi"));
  [[ia(), "hud-ia"], [moi(), "hud-moi"]].forEach(([p, id]) => { if (p.points !== ptsAff[p.i]) { const b = $(id).querySelector(".pts b"); if (b && p.points > ptsAff[p.i]) b.classList.add("bump"); ptsAff[p.i] = p.points; } });
  $("bar-ia").style.width = Math.min(100, ia().points / g.opts.cible * 100) + "%";
  for (const [p, id] of [[ia(), "zone-ia"], [moi(), "zone-moi"]]) {
    const z = $(id); z.innerHTML = "";

      if (mode && mode.type === "tuysse") { if (c === mode.anc) el.classList.add("choisi"); else if (p === moi() && M.peutTuysser(g, moi(), mode.anc, c)) el.classList.add("cible"); }
      el.onclick = () => clicZone(p, c); z.appendChild(el);

  for (const [p, id] of [[ia(), "tab-ia"], [moi(), "tab-moi"]]) { const s = $(id); s.textContent = p.tab ? p.tab.def.name : "vide"; s.className = "slot" + (p.tab ? " plein" : ""); s.onclick = p.tab ? () => fiche(p.tab, p) : null; }
  const m = $("main"); m.innerHTML = "";
  moi().main.forEach(c => { const k = c.def.type === "Gadz" ? c.def.cost : M.cout(g, moi(), c); const el = carteEl(c, { cout: k || null }); if (g.actif === 0 && !occupe && M.jouable(g, moi(), c)) el.classList.add("jouable"); el.onclick = () => fiche(c, moi(), "main"); m.appendChild(el); });

  else if (!p.gadzPose && p.main.some(M.vrai_gadz)) hint = "Tu peux poser un Gadz";
  $("res").innerHTML = `Ressources <b>${p.pool.any}</b>${types.map(t => ` · ${t} <b>${p.pool[t]}</b>`).join("")}<span class="hint">${hint}</span>`;
  $("b-fin").disabled = g.fini || g.actif !== 0 || occupe;
  const lg = g.log.filter(l => l.cls !== "tour").slice(-2);

// ---------- Feuilles ----------
function feuille(html, opts = {}) {
  const v = document.createElement("div"); v.className = "voile";
  v.innerHTML = `<div class="feuille" role="dialog" aria-modal="true">${html}</div>`;
  if (!opts.bloquant) v.addEventListener("click", e => { if (e.target === v) fermer(v); });
  $("voiles").appendChild(v);
  const f = v.querySelector("[autofocus]") || v.querySelector("button"); if (f) f.focus();
  return v;
}
function fermer(v) { if (v && v.parentNode) v.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") { const l = $("voiles").lastElementChild; if (l && !l.dataset.bloquant) fermer(l); if (mode) { mode = null; rendre(); } } });

function fiche(c, p, ou) {
  const d = c.def, me = p === moi(), monTour = g.actif === 0 && !g.fini && !occupe;
  const acts = [];
  if (me && ou === "main") {
    const k = d.type === "Gadz" ? d.cost : M.cout(g, p, c);
    if (M.jouable(g, p, c)) acts.push(`<button class="btn go" data-a="jouer" type="button">${d.type === "Gadz" ? (d.proche ? `Poser (${k})` : "Poser (gratuit)") : `Jouer (${k})`}</button>`);
    else acts.push(`<button class="btn" type="button" disabled>${raisonPasJouable(c)}</button>`);
  }
  if (me && ou !== "main" && d.type === "Gadz" && monTour) {
    if (M.peutEngager(g, c)) {
      acts.push(`<button class="btn" data-a="res" type="button">Engager : +${M.valeurRes(g, p, c)} ressource${M.valeurRes(g, p, c) > 1 ? "s" : ""}</button>`);
      const r2 = M.fx(c).find(f => f.startsWith("res2:")); if (r2) acts.push(`<button class="btn" data-a="res2" type="button">Engager : +2 pour un ${r2.split(":")[1]}</button>`);
    }
    if (M.vrai_gadz(c) && p.zone.some(j => M.peutTuysser(g, p, c, j))) acts.push(`<button class="btn go" data-a="tuy" type="button">Tuysser…</button>`);
  }
  const etat = [];
  if (c.engage) etat.push("engagé"); if (c.crap >= 0) etat.push("Crap's : ne peut ni tuysser ni être tuyssé");
  if (ou !== "main" && M.vrai_gadz(c) && M.nouveau(g, null, c)) etat.push(reglages.arrivee === "C" ? "vient d'arriver : ne fait rien ce tour" : "vient d'arriver : ne peut pas encore tuysser");
  if (c.pinsBonus) etat.push(`Pin's Trad's : +${c.pinsBonus} ressource`);
  if (c.extraFx.length) etat.push("CP : a gagné un effet en plus");
  if (ou !== "main" && d.type === "Gadz" && M.protege(g, p, c)) etat.push("protégé des Manip' adverses");
  const vis = DB[d.id] ? vraieEl(c, DB[d.id], { cout: d.type === "Gadz" ? (d.cost || null) : M.cout(g, p, c) }).outerHTML : "";
  const v = feuille(`<div class="fiche-haut">${vis}<div class="txt"><div class="sous">${esc(d.type)}${d.type === "Gadz" ? " · " + esc(promTxt(d)) : ""} · ${esc(d.rar)}</div><h2>${esc(d.name)}</h2><p>${esc(d.text)}</p>${etat.length ? `<p class="sous" style="text-transform:none;letter-spacing:0">${etat.map(esc).join(" · ")}</p>` : ""}</div></div><div class="row">${acts.join("")}<button class="btn" data-a="x" type="button">Fermer</button></div>`);
  v.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const act = b.dataset.a; fermer(v);
    if (act === "jouer") { occupe = true; rendre(); await M.jouer(g, p, c, choixHumain); occupe = false; apres(); }
    if (act === "res") { occupe = true; await M.engager(g, p, c); occupe = false; apres(); }
    if (act === "res2") { occupe = true; await M.engager(g, p, c, M.fx(c).find(f => f.startsWith("res2:")).split(":")[1]); occupe = false; apres(); }
    if (act === "tuy") { mode = { type: "tuysse", anc: c }; rendre(); }
  });
}
function raisonPasJouable(c) {
  const p = moi();
  if (g.actif !== 0) return "Pas ton tour";
  if (c.def.type === "Gadz" && p.zone.some(x => x.def.id === c.def.id)) return "Déjà en zone de manip'";
  if (c.def.type === "Gadz" && !c.def.proche && p.gadzPose) return "Déjà un Gadz posé ce tour";
  const t = M.cibles(g, p, c); if (t && !t.length) return "Aucune cible possible";
  return "Pas assez de ressources";
}
async function clicZone(p, c) {
  if (mode && mode.type === "tuysse") {
    const anc = mode.anc; mode = null;
    if (p === moi() && M.peutTuysser(g, p, anc, c)) { occupe = true; rendre(); await M.tuysser(g, p, anc, c); occupe = false; apres(); return; }
    rendre(); if (c === anc) return;
  }

function apres() { rendre(); if (g.fini) finPartie(); }

// Choix demandés par les effets (cibles, monôme, Week's Fam's…)
function choixHumain(g, p, q) {
  if (q.type === "payer") return choixPaiement(g, p, q);
  return new Promise(res => {
    const titres = { defausse: "Quelle carte défausser ?", cible: "Choisis la cible", source: "Quel effet copier ?", weeks: `Quels Gadz poser ? (${q.n} max)`, degager: q.n > 1 ? `Quels Gadz dégager ? (${q.n} max)` : "Quel Gadz dégager ?", regarder: q.reste === "dessus" ? "Quelle carte piocher ? (les autres restent sur ta pioche)" : "Quelle carte garder ? (les autres vont sous ta pioche)", monome: `Qui forme le monôme ? (${q.n > 20 ? "tous" : q.n + " max"})` };
    if (q.type === "monome" && q.n > 20) return res(q.options);
    const multi = q.n > 1;
    const v = feuille(`<div class="sous">${esc(q.carte.def.name)}</div><h2>${titres[q.type] || "Choisis"}</h2><div class="grille" id="ch-g"></div><div class="row"><button class="btn go" data-a="ok" type="button" ${multi ? "" : "hidden"}>Valider</button><button class="btn" data-a="non" type="button">Annuler</button></div>`, { bloquant: true });
    const sel = new Set(), gr = v.querySelector("#ch-g");
    const pleine = q.type === "regarder" || q.type === "defausse" || q.type === "weeks";
    q.options.forEach(c => { const el = pleine ? carteEl(c, {}) : carteEl(c, { zone: true, court: true, mini: true }); if (!pleine) el.classList.add("mini"); el.onclick = () => { if (!multi) { fermer(v); res(c); return; } if (sel.has(c)) sel.delete(c); else if (sel.size < q.n) sel.add(c); el.classList.toggle("choisi", sel.has(c)); }; gr.appendChild(el); });
    v.querySelector('[data-a="ok"]').onclick = () => { fermer(v); res([...sel]); };
    v.querySelector('[data-a="non"]').onclick = () => { fermer(v); res(null); };
  });
}

// Paiement : tu choisis quelles cartes engager (le jeu propose déjà une sélection)
function choixPaiement(g, p, q) {
  return new Promise(res => {
    const val = c => q.resType && M.fx(c).includes("res2:" + q.resType) ? Math.max(2, M.valeurRes(g, p, c)) : M.valeurRes(g, p, c);
    // Suggestion : d'abord ce qui ne peut pas tuysser (proches, nouveaux), puis le moins utile
    const sugg = q.options.slice().sort((x, y) => (M.peutParticiper(g, p, y) - M.peutParticiper(g, p, x)) || val(y) - val(x)).reverse();
    const sel = new Set(); let tot = 0; for (const c of sugg) { if (tot >= q.besoin) break; sel.add(c); tot += val(c); }
    const v = feuille(`<div class="sous">Paiement</div><h2>Engager pour ${q.besoin} ressource${q.besoin > 1 ? "s" : ""}</h2><p class="compte" id="pay-t"></p><div class="grille" id="ch-g"></div><div class="row"><button class="btn go" data-a="ok" type="button">Payer</button><button class="btn" data-a="non" type="button">Annuler</button></div>`, { bloquant: true });
    const gr = v.querySelector("#ch-g"), ok = v.querySelector('[data-a="ok"]');
    const maj = () => { const t = [...sel].reduce((s, c) => s + val(c), 0); v.querySelector("#pay-t").textContent = `Sélection : ${t} / ${q.besoin}. Touche les cartes à engager.`; ok.disabled = t < q.besoin; };
    q.options.forEach(c => { const el = carteEl(c, { zone: true, court: true, mini: true }); el.classList.add("mini"); el.insertAdjacentHTML("beforeend", `<span class="tag">+${val(c)}</span>`); el.classList.toggle("choisi", sel.has(c));
      el.onclick = () => { sel.has(c) ? sel.delete(c) : sel.add(c); el.classList.toggle("choisi", sel.has(c)); maj(); }; gr.appendChild(el); });
    maj();
    ok.onclick = () => { fermer(v); res([...sel]); };
    v.querySelector('[data-a="non"]').onclick = () => { fermer(v); res(null); };
  });
}

// Fenêtre de réaction (30 s) quand l'IA tuysse et que tu as une Manip' jouable
function reactionHumain(g, p, ev) {
  // Seules les Manip' qui peuvent empêcher le tuyssage sont proposées (une par nom)
  const vus = new Set(), manips = p.main.filter(c => c.def.type === "Manip'" && c.def.fx[0] === "jetplacks" && M.jouable(g, p, c, true) && !vus.has(c.def.name) && vus.add(c.def.name));
  if (!manips.length) return false;
  return new Promise(res => {
    const pts = M.pointsTuysse(g, ev.joueur, ev.anc, ev.jeune);
    const v = feuille(`<div class="sous">Réaction</div><h2>${esc(ev.anc.def.name)} va tuysser ${esc(ev.jeune.def.name)}</h2><p>L'IA marquerait ${pts} point${pts > 1 ? "s" : ""}. Tu peux jouer une Manip' maintenant.</p><div class="jauge"><i id="jg"></i></div><div class="row">${manips.map((c, i) => `<button class="btn go" data-i="${i}" type="button">${esc(c.def.name)} (${M.cout(g, p, c)})</button>`).join("")}<button class="btn" data-a="pass" type="button">Laisser faire</button></div>`, { bloquant: true });
    const D = 30000, t0 = performance.now(); let fini = false;
    const tick = () => { if (fini) return; const k = 1 - (performance.now() - t0) / D; v.querySelector("#jg").style.width = Math.max(0, k * 100) + "%"; if (k <= 0) { fini = true; fermer(v); res(false); } else requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    v.querySelector('[data-a="pass"]').onclick = () => { fini = true; fermer(v); res(false); };
    v.querySelectorAll("[data-i]").forEach(b => b.onclick = async () => { fini = true; fermer(v); const ok = await M.jouer(g, p, manips[+b.dataset.i], choixHumain, { reaction: true }); rendre(); res(ok); });
  });
}

// ---------- Animations ----------
const elDe = c => document.querySelector(`#zone-moi [data-uid="${c.uid}"], #zone-ia [data-uid="${c.uid}"]`);
const centre = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
async function animer(type, d) {
  if (type === "joue") {
    rendre();
    const v = document.createElement("div"); v.className = "vitrine";
    const el = carteEl(d.c, { cout: d.k || null });
    v.style.setProperty("--dy", d.p.i === 0 ? "220px" : "-220px"); v.style.setProperty("--dy2", d.p.i === 0 ? "-40px" : "40px");
    v.innerHTML = `<span class="qui">${d.p.i === 0 ? "Tu joues" : "L'IA joue"}</span>`; v.appendChild(el);
    if (el.classList.contains("cv")) v.insertAdjacentHTML("beforeend", `<div class="effet">${esc(d.c.def.text)}</div>`);
    document.body.appendChild(v);
    await pause(reduit ? 700 : d.p.i === 0 ? 1300 : 2000);
    v.classList.add("sort"); await pause(330); v.remove();
  }
  if (type === "pose") {
    rendre(); const el = elDe(d.c);
    if (el) { el.style.setProperty("--dy", d.p.i === 0 ? "60px" : "-60px"); el.classList.add("pop"); }
    await pause(reduit ? 150 : 550);
  }
  if (type === "tuysse") {
    rendre();
    const A = elDe(d.anc), J = elDe(d.jeune); if (!A || !J) return;
    A.classList.add("tuy-anc"); J.classList.add("tuy-jeune");
    const a = centre(A), b = centre(J), mx = (a.x + b.x) / 2, my = Math.min(a.y, b.y) - 50;
    const sc = document.createElementNS("http://www.w3.org/2000/svg", "svg"); sc.setAttribute("class", "scene"); sc.setAttribute("width", innerWidth); sc.setAttribute("height", innerHeight);
    const path = document.createElementNS(sc.namespaceURI, "path"); path.setAttribute("d", `M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`); sc.appendChild(path);
    const dot = document.createElementNS(sc.namespaceURI, "circle"); dot.setAttribute("r", 6); sc.appendChild(dot);
    document.body.appendChild(sc);
    const len = path.getTotalLength(); path.style.setProperty("--len", len);
    // une étincelle file de l'ancien vers le plus jeune : la transmission
    const t0 = performance.now(), D = reduit ? 1 : 650;
    await new Promise(res => { (function f(t) { const k = Math.min(1, (t - t0) / D), pt = path.getPointAtLength(len * k); dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); if (k < 1) requestAnimationFrame(f); else res(); })(t0); });
    const fl = document.createElement("div"); fl.className = "flottant"; fl.textContent = "+" + d.pts; fl.style.left = b.x + "px"; fl.style.top = b.y + "px"; document.body.appendChild(fl);
    await pause(reduit ? 200 : 700);
    sc.remove(); setTimeout(() => fl.remove(), 900);
    A.classList.remove("tuy-anc"); J.classList.remove("tuy-jeune");
  }
}

// ---------- Déroulement ----------
async function tourDeLIA() {
  occupe = true; rendre();
  await pause(600);
  await M.tourIA(g, async () => { rendre(); await pause(450); });
  if (!g.fini) { await pause(400); M.finTour(g); }
  occupe = false; apres();
}
$("b-fin").onclick = async () => { if (g.actif !== 0 || g.fini) return; mode = null; M.finTour(g); rendre(); if (!g.fini && g.actif === 1) await tourDeLIA(); };
function nouvelle() {
  const mon = reglages.mesCartes && PSEUDO ? deckCollection() : null;
  g = M.nouvellePartie({ noms: [PSEUDO || "Toi", "IA"], arrivee: reglages.arrivee, cible: reglages.cible, decks: mon ? [mon] : [] });
  g.onEvent = animer; ptsAff = [0, 0]; g.choixPar = [choixHumain, null];
  g.reaction = (gg, p, ev) => p.i === 0 ? reactionHumain(gg, p, ev) : M.reactionIA(gg, p, ev);
  $("voiles").innerHTML = ""; mode = null; occupe = false;
  rendre();
  if (g.actif === 1) tourDeLIA();
}
function finPartie() {
  const gagne = g.gagnant === 0;
  feuille(`<div class="fin"><div class="sous">Fin de partie</div><h2>${gagne ? "Victoire !" : "L'IA l'emporte"}</h2></div><p>Toi ${moi().points} · IA ${ia().points}, après ${Math.ceil(g.tour / 2)} tours chacun.</p><p class="sous" style="text-transform:none;letter-spacing:0">Tes points : ${moi().stats.ptsTuysse} par tuyssages, ${moi().stats.ptsCartes} par les cartes.</p><div class="row"><button class="btn go" id="b-re" type="button">Rejouer</button><button class="btn" id="b-reg2" type="button">Réglages</button></div>`, { bloquant: true });
  $("b-re").onclick = nouvelle; $("b-reg2").onclick = () => { $("voiles").innerHTML = ""; ecranReglages(); };
}
$("b-journal").onclick = () => {
  const html = g.log.map(l => `<div class="${l.cls || ""}">${esc(l.txt)}</div>`).join("");
  const v = feuille(`<h2>Journal</h2><div class="log-full">${html}</div><div class="row"><button class="btn" type="button" data-a="x">Fermer</button></div>`);
  v.querySelector('[data-a="x"]').onclick = () => fermer(v);
  const f = v.querySelector(".feuille"); f.scrollTop = f.scrollHeight;
};
$("b-regles").onclick = () => {
  const v = feuille(`<h2>Règles du prototype</h2><div class="regles">
  <h3>Gagner</h3><ul><li>Le premier à <b>${g.opts.cible} points de Trad's</b> gagne.</li><li>Le second joueur commence avec <b>6 cartes et 1 point</b>, pour compenser.</li></ul>
  <h3>Ton tour</h3><ul><li>Tes cartes se dégagent, puis tu pioches 1 carte (le premier joueur ne pioche pas à son premier tour).</li><li>Tu peux poser <b>1 Gadz gratuitement</b> par tour. Les Za et Zon se paient et ne comptent pas dans cette limite.</li><li>Chaque carte de ta zone peut être <b>engagée</b> une fois : soit pour donner de la <b>ressource</b>, soit pour <b>tuysser</b>.</li><li>La ressource paie les Trad's, Chants, Manip' et Tabagn's. Elle est perdue à la fin du tour.</li></ul>
  <h3>Tuysser</h3><ul><li>Touche un Gadz, puis « Tuysser… », puis un Gadz <b>plus jeune</b>. Les deux s'engagent.</li><li>Pas de limite par tour : un Gadz peut tuysser ou être tuyssé <b>tant qu'il est dégagé</b>. Les cartes qui dégagent permettent donc de tuysser à nouveau.</li><li>Les effets « ne s'engage pas » ou « reste dégagé » ne jouent que la première fois par tour.</li><li><b>1 point</b>, ou <b>2</b> si leurs prom's se suivent (l'ancien et son conscrit) ou s'il y a 10 prom's d'écart ou plus.</li><li>Le <b>.onscrit</b> rapporte 2 points (bonus compris), 3 fois maximum, puis donne 2 ressources.</li><li>Les Za et Zon ne tuyssent pas et ne sont pas tuyssés.</li><li>${reglages.arrivee === "A" ? "Un Gadz qui vient d'arriver peut donner de la ressource, mais ne tuysse qu'au tour suivant." : reglages.arrivee === "B" ? "Un Gadz qui vient d'arriver peut tout faire tout de suite." : "Un Gadz qui vient d'arriver ne fait rien avant le tour suivant."}</li></ul>
  <h3>Cartes</h3><ul><li><b>Trad's, Chants, Tabagn's</b> : seulement pendant ton tour.</li><li><b>Manip'</b> : à tout moment. Quand l'IA tuysse et que tu as une Manip' jouable, tu as 30 secondes pour réagir.</li><li><b>Tabagn's</b> : 1 seul en place, le nouveau remplace l'ancien.</li></ul>
  <h3>Pioche vide</h3><ul><li>On remélange le K'jib pour refaire une pioche, et l'adversaire marque <b>5 points</b>.</li></ul>
  <p class="sous" style="text-transform:none;letter-spacing:0">Pour payer, si tes ressources ne suffisent pas, le jeu te propose les cartes à engager : tu peux changer la sélection.</p></div><div class="row"><button class="btn" type="button" data-a="reg">Réglages et nouvelle partie</button><button class="btn" type="button" data-a="x">Fermer</button></div>`);
  v.querySelector('[data-a="x"]').onclick = () => fermer(v);
  v.querySelector('[data-a="reg"]').onclick = () => { fermer(v); ecranReglages(); };
};
function ecranReglages() {
  const v = feuille(`<div class="sous">Prototype · ${PSEUDO ? "connecté : " + esc(PSEUDO) : "non connecté"}</div><h2>Nouvelle partie</h2>
  <div class="opts" role="radiogroup" aria-label="Gadz qui vient d'arriver">
   <div class="sous">Un Gadz qui vient d'arriver…</div>
   <label><input type="radio" name="arr" value="A" ${reglages.arrivee === "A" ? "checked" : ""}><span><b>A.</b> donne de la ressource tout de suite, tuysse au tour suivant</span></label>
   <label><input type="radio" name="arr" value="B" ${reglages.arrivee === "B" ? "checked" : ""}><span><b>B.</b> peut tout faire tout de suite</span></label>
   <label><input type="radio" name="arr" value="C" ${reglages.arrivee === "C" ? "checked" : ""}><span><b>C.</b> ne fait rien avant le tour suivant</span></label>
  </div>
  ${PSEUDO ? `<div class="opts"><div class="sous">Ton deck</div>
   <label><input type="radio" name="dk" value="0" ${!reglages.mesCartes ? "checked" : ""}><span><b>Toutes les cartes</b>, tirées au hasard. Celles que tu possèdes apparaissent dans ta plus belle version.</span></label>
   <label><input type="radio" name="dk" value="1" ${reglages.mesCartes ? "checked" : ""} ${deckCollection() ? "" : "disabled"}><span><b>Seulement mes cartes</b>${deckCollection() ? "" : " (il te faut au moins 30 cartes dont 12 Gadz)"}</span></label></div>`
   : `<p class="compte">Connecte-toi d'abord sur la Collec' (même téléphone, même navigateur) pour jouer avec tes propres versions des cartes.</p>`}
  <div class="row"><button class="btn go" type="button" data-a="go">Lancer la partie</button><button class="btn" type="button" data-a="x">Annuler</button></div>`, { bloquant: !g });
  v.querySelector('[data-a="go"]').onclick = () => { const r = v.querySelector('input[name="arr"]:checked'); reglages.arrivee = r ? r.value : "A"; const dk = v.querySelector('input[name="dk"]:checked'); reglages.mesCartes = !!(dk && dk.value === "1"); try { localStorage.setItem("duel23151-reglages", JSON.stringify(reglages)); } catch (e) {} fermer(v); nouvelle(); };
  v.querySelector('[data-a="x"]').onclick = () => { fermer(v); if (!g) nouvelle(); };
}
charger().then(nouvelle);
</script>
